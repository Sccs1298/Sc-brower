<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>תודה על ההזמנה | KLARO</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="store.js"></script>
<style>
body{margin:0;font-family:Heebo,Arial,sans-serif;background:#0b1c2c;color:#fff;min-height:100vh;display:grid;place-items:center;padding:16px;box-sizing:border-box}
.box{max-width:520px;text-align:center}
.ok{width:84px;height:84px;border-radius:50%;background:#b6f000;color:#0b1c2c;font-size:44px;font-weight:900;display:grid;place-items:center;margin:0 auto 18px}
h1{font-size:32px;margin:0 0 10px}
p{color:#c9d6e2;font-size:17px;line-height:1.6}
a{color:#b6f000}
</style>
</head>
<body>
<div class="box">
  <div class="ok">✓</div>
  <h1>תודה, ההזמנה אצלנו!</h1>
  <p>קבלה על התשלום כבר בדרך למייל. כשהחבילה יוצאת נשלח לך מספר מעקב.<br>זה מגיע עד הבית תוך 10 עד 18 ימי עסקים.</p>
  <p>שאלות? <span data-biz="phone"></span> · <span data-biz="email"></span></p>
  <p style="font-size:15px">אחרי שתנסה, נשמח לתמונה של השמשה לפני ואחרי בוואטסאפ. מי ששולח מקבל קופון להזמנה הבאה 🙂</p>
  <p><a href="index.html">חזרה לאתר</a></p>
</div>
<script>
(function(){
  var S = window.STORE, p;
  try { p = new URLSearchParams(location.search).get('p') || sessionStorage.getItem('pending_pkg'); } catch(e){}
  var pkg = S.packages[p];
  // שולחים Purchase רק פעם אחת ורק אם הגיעו מהקופה
  var key = 'purchased_' + p;
  var fired = false; try { fired = sessionStorage.getItem(key); } catch(e){}
  if (pkg && !fired) {
    track('Purchase', { value: pkg.price, currency: 'ILS', num_items: pkg.qty, content_ids: ['klaro-' + p], content_type: 'product' });
    try { sessionStorage.setItem(key, '1'); sessionStorage.removeItem('pending_pkg'); } catch(e){}
  }
})();
</script>
</body>
</html>
