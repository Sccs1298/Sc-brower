<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="../cine.css">
<style>
  .job .logo { width: 110px; height: 110px; border-radius: 30px; background: linear-gradient(135deg,#2b2b30,#0d0d0f); }
  .job .title { font: 700 58px Heebo; margin: 30px 0 8px; direction: ltr; text-align: right; }
  .job .meta { font: 400 42px Heebo; opacity: .6; }
  .tag { display: inline-block; margin: 26px 0 32px; padding: 14px 30px; border-radius: 999px; background: rgba(48,164,108,.16); color: #1f8a57; font: 700 40px Heebo; }
  .step { text-align: center; padding: 70px 40px !important; }
  .step .n { font: 900 64px Heebo; color: var(--accent); direction: ltr; }
  .step .ic { font: 900 170px/1.1 Heebo; }
  .step .lb { font: 900 110px Heebo; }
  .bar { height: 22px; border-radius: 11px; background: rgba(255,255,255,.15); overflow: hidden; margin-top: 40px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); }
  .wallet .lab { font: 700 42px Heebo; opacity: .65; }
  .wallet .bal { font: 900 118px Heebo; direction: ltr; text-align: right; margin: 22px 0 36px; letter-spacing: -2px; }
  .live { display: inline-block; width: 24px; height: 24px; border-radius: 50%; background: var(--green); margin-left: 14px; }
  .sw { display: inline-block; width: 260px; height: 146px; border-radius: 73px; background: var(--green); position: relative; vertical-align: middle; }
  .sw i { position: absolute; top: 13px; width: 120px; height: 120px; border-radius: 50%; background: #fff; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
  .coins { position: absolute; top: 600px; left: 80px; right: 80px; display: flex; gap: 40px; transform-style: preserve-3d; }
  .coin { flex: 1; height: 520px; border-radius: 50px; text-align: center; padding-top: 150px; position: relative; overflow: hidden;
    background: linear-gradient(160deg, rgba(255,255,255,.13), rgba(255,255,255,.03)); border: 1.5px solid rgba(255,255,255,.15); }
  .coin b { font: 900 100px Heebo; display: block; direction: ltr; }
  .coin span { font: 400 46px Heebo; opacity: .6; }
  .ice { position: absolute; inset: 0; background: linear-gradient(160deg, rgba(170,215,255,.75), rgba(120,170,255,.2)); }
  .ice:after { content: '❄'; position: absolute; top: 30px; left: 30px; font-size: 70px; }
  .ownes .k { font: 700 46px Heebo; opacity: .6; }
  .ownes .v { font: 900 170px Heebo; direction: ltr; text-align: right; margin: 16px 0 6px; }
  .follow { text-align: center; }
  .follow .lg { width: 230px; height: 230px; border-radius: 50%; margin: 0 auto 30px; background: radial-gradient(circle at 35% 30%, #c4a1ff, #9D5CFF 55%, #5b21b6);
    font: 900 110px/230px Heebo; color: #fff; box-shadow: 0 30px 60px rgba(157,92,255,.35); }
  .follow .nm { font: 900 76px Heebo; direction: ltr; }
  .follow .hd { font: 400 44px Heebo; opacity: .55; margin: 4px 0 40px; direction: ltr; }
  .cursor { position: absolute; width: 84px; height: 84px; }
  .stamp { display: inline-block; padding: 26px 60px; border: 10px solid var(--red); color: var(--red); border-radius: 26px; font: 900 130px Heebo; }
  .redtint .bgfill { background: radial-gradient(ellipse 70% 45% at 50% 45%, rgba(229,72,77,.35), transparent 70%), linear-gradient(#1a0c0d, #050303) !important; }
  .icetint .bgfill { background: radial-gradient(ellipse 70% 45% at 50% 45%, rgba(120,180,255,.30), transparent 70%), linear-gradient(#0c1220, #03050a) !important; }

  .pizza { position:absolute; width:520px; height:520px; border-radius:50%; left:280px; top:430px;
    background: radial-gradient(circle at 50% 50%, #f6c453 0 58%, #e09a3a 59% 66%, #c97a2b 67% 100%);
    box-shadow: 0 50px 80px rgba(0,0,0,.5), inset 0 0 0 18px #b8692a; }
  .pizza i { position:absolute; width:70px; height:70px; border-radius:50%; background: radial-gradient(circle at 35% 35%, #e0473f, #a3201b); }
  .pizza b { position:absolute; left:50%; top:0; width:4px; height:100%; background:rgba(120,60,10,.55); transform-origin:center; }
  .post { direction:ltr; text-align:left; }
  .post .u { font:700 40px Heebo; color:#7B3FF2; } .post .d { font:400 30px Heebo; opacity:.55; margin-left:14px; }
  .post .t { font:700 50px/1.3 Heebo; margin-top:22px; }
  .hdd { position:absolute; left:290px; top:470px; width:500px; height:640px; border-radius:36px;
    background: linear-gradient(160deg,#3a3a42,#16161a); border:2px solid rgba(255,255,255,.15); box-shadow:0 50px 90px rgba(0,0,0,.6); }
  .hdd:before { content:''; position:absolute; left:70px; top:80px; width:360px; height:360px; border-radius:50%;
    background: radial-gradient(circle, #9aa0aa 0 8%, #2b2d33 9% 12%, #cfd3da 13% 70%, #8d929b 71%); }
  .hdd span { position:absolute; left:0; right:0; bottom:60px; text-align:center; font:700 34px "DejaVu Sans Mono", monospace; color:#ffd166; letter-spacing:3px; }
  .dump { position:absolute; left:60px; right:60px; top:860px; height:420px; }
  .dump i { position:absolute; bottom:0; border-radius:50% 50% 0 0; }
  .paper { direction:ltr; text-align:center; font-family: "DejaVu Serif", serif; }
  .paper .h { font:700 52px "DejaVu Serif", serif; line-height:1.25; } .paper .a { font:400 36px "DejaVu Serif", serif; margin-top:18px; opacity:.7; }
  .paper .l { height:14px; border-radius:7px; background:rgba(0,0,0,.12); margin:22px 30px 0; }
  .mail { direction:ltr; text-align:left; } .mail .f { font:700 36px Heebo; opacity:.6; } .mail .b { font:400 56px/1.3 "DejaVu Serif", serif; margin-top:24px; }
  .q { position:absolute; left:0; right:0; text-align:center; font:900 360px/1 Heebo; color:var(--accent); }
</style></head>
<body><div id="stage"></div>
<script src="viral_landfill_timing.js"></script>
<script src="../cine2.js"></script>
<script>
const G = (t, cls, top, st = '') => KT(t, cls, `top:${top}px;${st}`);
function auto(lt, el) {
  $$(el, '.kt').forEach((r, i) => kin(r, lt, .02 + i * .12, .06));
  $$(el, '.card').forEach((c, i) => card3d(c, lt, i * .1));
  $$(el, '.icon').forEach(c => icon3d(c, lt, 0));
}
const AV = (x, y, evil) => `<div class="avatar ${evil ? 'evil' : ''}" style="left:${x - 140}px;top:${y - 140}px;transform-origin:center"><span class="eye" style="right:76px"></span><span class="eye" style="left:76px"></span></div>`;
function avatar(el, lt) { const a = $(el, '.avatar'); if (!a) return; const p = P(lt, 0, .5, back);
  a.style.opacity = clamp(p); a.style.transform = `translate3d(0,${Math.sin(lt * 2) * 12}px,${-300 * (1 - p)}px) scale(${1.6 * (.7 + .3 * p)}) rotateY(${Math.sin(lt * 1.3) * 22}deg)`; }

window.SCENES = [
 { at: [0, 'בוויילס'], theme: 'dark', ring: [540, 1000, 0],
   bp: [{ d: [160, 820, 920, 820], label: 'NEWPORT // WALES', at: .2 }],
   mid: `<div class="dump"><i style="left:0;width:520px;height:300px;background:#4a3d2f"></i><i style="left:300px;width:640px;height:400px;background:#5b4a37"></i><i style="left:180px;width:420px;height:200px;background:#3a3026"></i></div>`
     + G('מזבלה.', 'giga', 520, 'font-size:220px'), anim(lt, dur, el) { auto(lt, el); } },
 { at: [0, 'מחצי מיליארד'], theme: 'black', tr: 'zoom', ring: [540, 820, 0], noTop: true,
   mid: `<div class="row giga num acc cnt" data-pre="$" data-to="600" data-post="M" style="top:680px;font-size:260px">$0</div>` + G('קבורים בתוכה.', 'h1', 990, 'font-size:100px'), anim(lt, dur, el) { auto(lt, el); const m = $(el, '.cnt'), p = P(lt, 0, 1.1, easeInOut); m.textContent = m.dataset.pre + Math.round(+m.dataset.to * p).toLocaleString('en-US') + m.dataset.post; } },
 { at: [1, 'ב-2013'], theme: 'light', tr: 'whipR', ring: [540, 760, 0],
   mid: `<div class="row giga num" style="top:640px;font-size:300px">2013</div>` + G('רגע של ניקיון', 'h2', 960, 'font-size:64px;opacity:.6'), anim(lt, dur, el) { auto(lt, el); } },
 { at: [1, 'זרק'], theme: 'dark', tr: 'whipL', ring: [540, 790, 300],
   mid: `<div class="hdd"><span>HDD · 2013</span></div>` + G('לפח.', 'giga acc', 1150, 'font-size:180px'), anim(lt, dur, el) { auto(lt, el); } },
 { at: [2, 'המפתחות'], theme: 'dark', tr: 'zoom', ring: [540, 640, 230],
   mid: ICON('key', 540, 640, 460) + `<div class="row giga num" style="top:960px;font-size:220px">8,000 ₿</div>`, anim(lt, dur, el) { auto(lt, el); } },
 { at: [3, 'נקבר'], theme: 'black', tr: 'whipR', ring: [540, 1000, 0],
   mid: `<div class="dump"><i style="left:0;width:520px;height:340px;background:#4a3d2f"></i><i style="left:300px;width:640px;height:420px;background:#5b4a37"></i></div>`
     + G('איפשהו כאן.', 'h1', 560, 'font-size:110px') + G('בערך.', 'h2 acc', 700, 'font-size:70px'), anim(lt, dur, el) { auto(lt, el); } },
 { at: [4, 'יותר'], theme: 'light', tr: 'zoom', ring: [540, 640, 230],
   mid: ICON('clock', 540, 640, 460) + G('יותר מעשור.', 'giga', 960, 'font-size:180px'), anim(lt, dur, el) { auto(lt, el); } },
 { at: [5, 'הציע'], theme: 'dark', tr: 'whipL', ring: [540, 640, 230],
   mid: ICON('money-bag', 540, 640, 460) + G('"תקבלו חלק"', 'h1', 1000, 'font-size:110px'), anim(lt, dur, el) { auto(lt, el); } },
 { at: [5, 'סירבו'], theme: 'dark', cls: 'redtint', tr: 'zoom', ring: [540, 820, 0],
   mid: `<div class="row" style="top:700px"><span class="stamp">סירבו</span></div>`, anim(lt, dur, el) { auto(lt, el); const s = $(el, '.stamp'), p = P(lt, .15, .3, back); s.style.opacity = clamp(p); s.style.transform = `rotate(-8deg) scale(${2.4 - 1.4 * p})`; } },
 { at: [6, 'בית'], theme: 'light', tr: 'whipR', ring: [540, 820, 0],
   mid: G('בית המשפט:', 'h1', 600, 'font-size:100px') + `<div class="row" style="top:760px"><span class="stamp">נדחה</span></div>`, anim(lt, dur, el) { auto(lt, el); const s = $(el, '.stamp'), p = P(lt, .15, .3, back); s.style.opacity = clamp(p); s.style.transform = `rotate(-8deg) scale(${2.4 - 1.4 * p})`; } },
 { at: [6, 'מפסיק'], theme: 'dark', tr: 'whipL', ring: [540, 790, 300],
   mid: `<div class="hdd" style="opacity:.6"><span>GAME OVER?</span></div>` + G('אחרי יותר מעשור.', 'h1', 1180, 'font-size:100px'), anim(lt, dur, el) { auto(lt, el); } },
 { at: [7, '8,000'], theme: 'black', tr: 'zoom', ring: [540, 820, 0], noTop: true,
   mid: `<div class="row giga num" style="top:640px;font-size:220px">8,000 ₿</div>` + G('עדיין מתחת לזבל.', 'h1 acc', 920, 'font-size:100px'), anim(lt, dur, el) { auto(lt, el); } },
 { at: [8, 'מה'], theme: 'light', tr: 'whipR', ring: [540, 760, 0], noTop: true,
   mid: G('מה הדבר הכי יקר', 'h1', 640, 'font-size:100px') + G('שזרקתם בטעות?', 'h1 acc', 780, 'font-size:100px') + G('ספרו בתגובות 👇', 'h2', 960, 'font-size:60px'), anim(lt, dur, el) { auto(lt, el); } },
];
window.addEventListener('load', () => SCENES.forEach(s => s.cls && s.el.classList.add(s.cls)));
</script></body></html>
