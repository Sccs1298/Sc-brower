<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@500;800;900&display=swap" rel="stylesheet">
<script src="../../docs/glass.js"></script>
<style>html,body{margin:0;background:#000}#g{position:absolute;left:-99999px}</style>
</head><body>
<canvas id="out"></canvas>
<canvas id="g"></canvas>
<script>
/* Deterministic ad renderer. window.renderFrame(i) draws frame i at FPS. */
var P = new URLSearchParams(location.search);
var W = +P.get('w') || 1080, H = +P.get('h') || 1920, FPS = 30, DUR = 15;
var out = document.getElementById('out'); out.width = W; out.height = H;
var o = out.getContext('2d');
var gc = document.getElementById('g');
var GW = W, GH = Math.round(H * (H > W * 1.5 ? 0.62 : 0.7));
gc.style.width = GW + 'px'; gc.style.height = GH + 'px';
var glass, path = Glass.path(5), done = 0;
var LIME = '#c6ff1a', NIGHT = '#060d17';
Math.random = (function(s){ return function(){ s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; })(42);

window.setup = function () {
  window.devicePixelRatio = 1;
  glass = new Glass(gc, { interactive: false, rain: 1.4 });
  return true;
};

function txt(t, x, y, size, color, weight, maxW) {
  o.font = (weight || 900) + ' ' + size + 'px Heebo, Arial'; o.fillStyle = color; o.textAlign = 'center'; o.textBaseline = 'middle'; o.direction = 'rtl';
  o.fillText(t, x, y, maxW || W * 0.9);
}
function pill(x, y, w, h, r, fill) { o.beginPath(); o.moveTo(x + r, y); o.arcTo(x + w, y, x + w, y + h, r); o.arcTo(x + w, y + h, x, y + h, r); o.arcTo(x, y + h, x, y, r); o.arcTo(x, y, x + w, y, r); o.closePath(); o.fillStyle = fill; o.fill(); }
function ease(t) { return t < 0 ? 0 : t > 1 ? 1 : t * t * (3 - 2 * t); }

window.renderFrame = function (i) {
  var t = i / FPS, s = W / 1080;
  // ---- glass timeline ----
  var a = Math.min(1, Math.max(0, (t - 2.6) / 6.2));
  var target = Math.floor(a * (path.length - 1));
  for (var k = done; k < target; k++) glass.stroke({ x: path[k][0] * glass.w, y: path[k][1] * glass.h }, { x: path[k + 1][0] * glass.w, y: path[k + 1][1] * glass.h });
  done = Math.max(done, target);
  glass.sponge = (a > 0 && a < 1) ? { x: path[target][0] * glass.w, y: path[target][1] * glass.h - glass.h * 0.02, a: Math.sin(i / 4) * 0.15 } : null;
  if (t > 9) { glass.clearAll(); glass.opts.rain = 3; }
  glass.t = i * 33; glass.frame(33);

  // ---- compose ----
  o.fillStyle = NIGHT; o.fillRect(0, 0, W, H);
  var top = Math.round((H - GH) * 0.42);
  o.drawImage(gc, 0, top, GW, GH);
  var g = o.createLinearGradient(0, top - 2, 0, top + 120 * s); g.addColorStop(0, NIGHT); g.addColorStop(1, 'rgba(6,13,23,0)'); o.fillStyle = g; o.fillRect(0, top - 2, W, 122 * s);
  g = o.createLinearGradient(0, top + GH - 120 * s, 0, top + GH + 2); g.addColorStop(0, 'rgba(6,13,23,0)'); g.addColorStop(1, NIGHT); o.fillStyle = g; o.fillRect(0, top + GH - 120 * s, W, 122 * s);

  var headY = top * 0.52, cx = W / 2, fs = 76 * s;
  if (t < 2.6) {
    txt('ככה אתה נוהג', cx, headY - fs * 0.55, fs, '#fff');
    txt('בגשם בלילה? 😬', cx, headY + fs * 0.6, fs, LIME);
  } else if (t < 9) {
    txt('5 דקות עם KLARO', cx, headY - fs * 0.55, fs, '#fff');
    txt('וספוג אחד…', cx, headY + fs * 0.6, fs, LIME);
  } else if (t < 11.5) {
    txt('ככה זה צריך', cx, headY - fs * 0.55, fs, '#fff');
    txt('להיראות ✨', cx, headY + fs * 0.6, fs, LIME);
  }
  // bottom caption
  var by = top + GH + (H - top - GH) * 0.5;
  if (t < 11.5) {
    var cap = t < 2.6 ? 'שכבת שומן על השמשה = מריחות וסנוור' : t < 9 ? 'מורחים עם הספוג המובנה ושוטפים במים' : 'שקוף. גם כשיורד גשם.';
    pill(W * 0.07, by - 52 * s, W * 0.86, 104 * s, 26 * s, 'rgba(255,255,255,.08)');
    txt(cap, cx, by, 44 * s, '#e6eef6', 700, W * 0.8);
  }
  // end card
  if (t >= 11.5) {
    var e = ease((t - 11.5) / 0.5);
    o.fillStyle = 'rgba(6,13,23,' + 0.78 * e + ')'; o.fillRect(0, 0, W, H);
    o.globalAlpha = e;
    var cy = H * 0.42;
    txt('KLARO', cx, cy - 170 * s, 150 * s, '#fff', 900);
    o.fillStyle = LIME; o.fillRect(cx - 120 * s, cy - 82 * s, 240 * s, 8 * s);
    txt('מסיר שכבת שומן לשמשות', cx, cy - 10 * s, 54 * s, '#d6e2ee', 700);
    txt('79 ₪ · משלוח חינם', cx, cy + 90 * s, 70 * s, LIME, 900);
    var bw = 560 * s, bh = 130 * s, pulse = 1 + Math.sin(t * 6) * 0.03;
    o.save(); o.translate(cx, cy + 260 * s); o.scale(pulse, pulse);
    pill(-bw / 2, -bh / 2 + 10 * s, bw, bh, 30 * s, '#93c400');
    pill(-bw / 2, -bh / 2, bw, bh, 30 * s, LIME);
    o.restore();
    txt('להזמנה ←', cx, cy + 260 * s, 62 * s, NIGHT, 900);
    txt('🔒 תשלום מאובטח   ↩️ 14 יום להחזרה', cx, cy + 410 * s, 38 * s, '#a9b9c9', 500);
    o.globalAlpha = 1;
  }
  // tiny disclaimer
  txt('המחשה', W - 70 * s, H - 30 * s, 22 * s, 'rgba(255,255,255,.35)', 500);
  return out.toDataURL('image/jpeg', 0.88);
};
window.FRAMES = FPS * DUR;
</script>
</body></html>
