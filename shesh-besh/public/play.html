<style>
/* Concept: a club backgammon table at night — deep baize, brass trim, ivory and ebony checkers.
   One deliberate dark game world (single theme). Screens: intro guide → lobby → table / wallet / tournaments. */
:root {
  color-scheme: dark;
  --baize: #0d2a1f; --baize-2: #12382a; --baize-deep: #071a13;
  --ink: #f3ead6; --ink-dim: #b9b29e; --ink-faint: #7f8a7c;
  --brass: #e0b04a; --brass-hi: #ffd77a; --brass-lo: #8c6418;
  --ivory: #f7efdc; --ebony: #1b1714; --ruby: #c2402e; --jade: #4fe09a; --sky: #7cc4ff;
  --panel: rgba(8, 24, 18, .72); --panel-line: rgba(224, 176, 74, .28);
  --display: "Secular One", "Frank Ruhl Libre", "Arial Hebrew", sans-serif;
  --serif: "Frank Ruhl Libre", "David", Georgia, serif;
  --body: "Assistant", "Segoe UI", Arial, sans-serif;
  --r: 16px;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; direction: rtl;
  background: radial-gradient(120% 80% at 50% 0%, var(--baize-2) 0%, var(--baize) 45%, var(--baize-deep) 100%) fixed, var(--baize);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 40px;
  overflow-x: hidden;
}
body::after { /* baize fibre */
  content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .18; z-index: 0;
  background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.03) 0 1px, transparent 1px 3px), repeating-linear-gradient(-45deg, rgba(0,0,0,.18) 0 1px, transparent 1px 4px);
}
#app { position: relative; z-index: 1; max-width: 1280px; margin: 0 auto; }
button { font: inherit; cursor: pointer; border: 0; color: inherit; background: none; }
button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; border-radius: 8px; }
.btn {
  font-family: var(--display); font-size: 1.05rem; letter-spacing: .01em; padding: 12px 22px; border-radius: 999px; color: #2a1b02;
  background: linear-gradient(180deg, var(--brass-hi), var(--brass) 55%, var(--brass-lo)); box-shadow: 0 4px 0 #5e420c, 0 10px 24px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.6);
  transition: transform .08s, box-shadow .08s, filter .2s;
}
.btn:hover { filter: brightness(1.07); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #5e420c, 0 4px 12px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.6); }

.btn.red { background: linear-gradient(180deg, #ff8a72, var(--ruby) 60%, #7c1f12); color: #fff; box-shadow: 0 4px 0 #551208, 0 10px 24px rgba(0,0,0,.45); }
.btn.sm { font-size: .9rem; padding: 8px 14px; }
.btn[disabled] { opacity: .45; pointer-events: none; }
input, select { font: inherit; color: var(--ink); background: rgba(0,0,0,.35); border: 1.5px solid var(--panel-line); border-radius: 10px; padding: 10px 12px; width: 100%; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; color: var(--ink-dim); font-weight: 700; }
.panel { background: var(--panel); border: 1px solid var(--panel-line); border-radius: var(--r); padding: 18px; backdrop-filter: blur(6px); box-shadow: 0 20px 50px rgba(0,0,0,.35); min-width: 0; }
.eyebrow { font-size: .75rem; letter-spacing: .14em; color: var(--brass); font-weight: 800; }

.muted { color: var(--ink-dim); }
.faint { color: var(--ink-faint); font-size: .85rem; }
.num { font-variant-numeric: tabular-nums; }

.chip.cash { color: var(--brass-hi); }
.chip.demo { color: var(--sky); border-color: rgba(124,196,255,.4); }

.hero h1 span { color: var(--brass); }
.hero p { max-width: 56ch; margin: 0; color: var(--ink-dim); font-size: 1.1rem; }

.dice-stage .bigdie { width: 72px; height: 72px; animation: bob 3.4s ease-in-out infinite; filter: drop-shadow(0 14px 14px rgba(0,0,0,.5)); }
.dice-stage .bigdie:nth-child(2) { animation-delay: -1.7s; }
@keyframes bob { 0%,100% { transform: translateY(0) rotate(-8deg); } 50% { transform: translateY(-12px) rotate(8deg); } }
.guide { display: grid; gap: 18px; margin-top: 18px; }

@media (max-width: 820px) { .slide { grid-template-columns: 1fr; } }

.conds { display: grid; gap: 12px; }

.bar .fill.weak { background: linear-gradient(90deg, #7c1f12, var(--ruby)); }

.exp .counter { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; text-align: center; }
.exp .counter div { background: rgba(0,0,0,.3); border-radius: 12px; padding: 10px 6px; border: 1px solid var(--panel-line); }

.pips-row { display: flex; flex-wrap: wrap; gap: 4px; min-height: 16px; }
.pips-row i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.pips-row i.t { background: var(--jade); } .pips-row i.w { background: var(--brass); } .pips-row i.l { background: var(--ruby); }
.mini-boards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.mini { border-radius: 12px; padding: 10px; background: rgba(0,0,0,.3); border: 1px solid var(--panel-line); text-align: center; }
.mini .dd { display: flex; justify-content: center; gap: 6px; margin-top: 6px; }
.mini .dd svg { width: 40px; height: 40px; }
.guide-nav { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; }

/* ---------- lobby ---------- */
.lobby { display: grid; gap: 18px; }
.lobby-hero { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; }
.lobby-hero h2 { font-family: var(--display); font-size: clamp(2rem, 6vw, 3rem); color: var(--ivory); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 16px; }
.tile { text-align: start; position: relative; overflow: hidden; border-radius: 20px; padding: 20px; min-height: 190px; display: flex; flex-direction: column; gap: 8px; justify-content: flex-end;
  background: linear-gradient(160deg, rgba(255,255,255,.08), rgba(0,0,0,.25)), var(--baize-2); border: 1px solid var(--panel-line); box-shadow: 0 16px 40px rgba(0,0,0,.4); transition: transform .15s, box-shadow .15s; }
.tile:hover { transform: translateY(-4px); box-shadow: 0 22px 50px rgba(0,0,0,.5); }

.tile p { margin: 0; color: var(--ink-dim); }
.tile .art { position: absolute; inset-inline-end: -10px; top: -6px; width: 130px; height: 130px; opacity: .9; }
.tile.gold { background: linear-gradient(160deg, rgba(255,215,122,.22), rgba(0,0,0,.35)), #2b2208; }
.tile .tag { align-self: flex-start; font-size: .75rem; font-weight: 800; letter-spacing: .1em; padding: 3px 10px; border-radius: 999px; background: rgba(0,0,0,.4); color: var(--brass-hi); }

<script>
// ---- engine/board.js ----
// Backgammon rules engine. Pure JS (ESM) — runs in Node and in the browser.
//
// Absolute board: points[0..23]. Positive = white checkers, negative = black.
// White moves from 23 -> 0 and bears off below 0; white home = 0..5.
// Black moves from 0 -> 23 and bears off above 23; black home = 18..23.
//
// Moves are expressed in the mover's OWN perspective:
//   own index 0..23 (0 = deepest home point), BAR = 24, OFF = -1.

const BAR = 24;
const OFF = -1;
const COLORS = ['w', 'b'];

const other = (c) => (c === 'w' ? 'b' : 'w');
const sign = (c) => (c === 'w' ? 1 : -1);
const toAbs = (c, i) => (c === 'w' ? i : 23 - i);
const toOwn = (c, a) => (c === 'w' ? a : 23 - a);

function initialState() {
  const points = new Array(24).fill(0);
  points[23] = 2; points[12] = 5; points[7] = 3; points[5] = 5;
  points[0] = -2; points[11] = -5; points[16] = -3; points[18] = -5;
  return { points, bar: { w: 0, b: 0 }, off: { w: 0, b: 0 } };
}

function cloneState(s) {
  return { points: s.points.slice(), bar: { ...s.bar }, off: { ...s.off } };
}

function stateKey(s) {
  return s.points.join(',') + '|' + s.bar.w + ',' + s.bar.b + '|' + s.off.w + ',' + s.off.b;
}

/** Number of `c`'s checkers on own index i. */
function ownCount(s, c, i) {
  const v = s.points[toAbs(c, i)] * sign(c);
  return v > 0 ? v : 0;
}

/** Number of opponent checkers on `c`'s own index i. */
function oppCount(s, c, i) {
  const v = -s.points[toAbs(c, i)] * sign(c);
  return v > 0 ? v : 0;
}

function allHome(s, c) {
  if (s.bar[c] > 0) return false;
  for (let i = 6; i < 24; i++) if (ownCount(s, c, i) > 0) return false;
  return true;
}

/** Returns destination own-index (or OFF) if checker at `from` can move `die`, else null. */
function singleTarget(s, c, from, die) {
  if (s.bar[c] > 0 && from !== BAR) return null;
  if (from === BAR) {
    if (s.bar[c] === 0) return null;
    const to = BAR - die;
    return oppCount(s, c, to) < 2 ? to : null;
  }
  if (from < 0 || from > 23 || ownCount(s, c, from) === 0) return null;
  const to = from - die;
  if (to >= 0) return oppCount(s, c, to) < 2 ? to : null;
  if (!allHome(s, c)) return null;
  if (to === -1) return OFF;
  for (let i = from + 1; i < 6; i++) if (ownCount(s, c, i) > 0) return null;
  return OFF;
}

/** Applies a single checker move (own perspective). Returns a new state. */
function applyMove(s, c, m) {
  const n = cloneState(s);
  const sg = sign(c);
  if (m.from === BAR) n.bar[c]--;
  else n.points[toAbs(c, m.from)] -= sg;
  if (m.to === OFF) {
    n.off[c]++;
  } else {
    const a = toAbs(c, m.to);
    if (n.points[a] === -sg) { // hit a blot
      n.points[a] = 0;
      n.bar[other(c)]++;
    }
    n.points[a] += sg;
  }
  return n;
}

function applySequence(s, c, seq) {
  let n = s;
  for (const m of seq) n = applyMove(n, c, m);
  return n;
}

function sources(s, c) {
  if (s.bar[c] > 0) return [BAR];
  const out = [];
  for (let i = 23; i >= 0; i--) if (ownCount(s, c, i) > 0) out.push(i);
  return out;
}

/**
 * All legal full-turn move sequences for dice [d1, d2].
 * Enforces: play as many dice as possible; if only one die can be played,
 * the larger must be played when possible. Sequences leading to identical
 * positions are de-duplicated. Returns [{ moves, state }]. If nothing is
 * playable, returns [{ moves: [], state }].
 */
function legalSequences(s, c, dice) {
  const [d1, d2] = dice;
  const orders = d1 === d2 ? [[d1, d1, d1, d1]] : [[d1, d2], [d2, d1]];
  const results = [];
  let maxLen = 0;

  const rec = (st, rest, moves) => {
    let moved = false;
    if (rest.length > 0) {
      const die = rest[0];
      for (const from of sources(st, c)) {
        const to = singleTarget(st, c, from, die);
        if (to === null) continue;
        moved = true;
        const m = { from, to, die };
        rec(applyMove(st, c, m), rest.slice(1), moves.concat([m]));
      }
    }
    if (!moved) {
      if (moves.length > maxLen) maxLen = moves.length;
      results.push({ moves, state: st });
    }
  };
  for (const order of orders) rec(s, order, []);

  let filtered = results.filter((r) => r.moves.length === maxLen);
  if (maxLen === 1 && d1 !== d2) {
    const hi = Math.max(d1, d2);
    if (filtered.some((r) => r.moves[0].die === hi)) {
      filtered = filtered.filter((r) => r.moves[0].die === hi);
    }
  }
  const seen = new Set();
  const out = [];
  for (const r of filtered) {
    const k = stateKey(r.state);
    if (seen.has(k)) continue;
    seen.add(k);
    out.push(r);
  }
  return out.length ? out : [{ moves: [], state: s }];
}

function pipCount(s, c) {
  let p = s.bar[c] * 25;
  for (let i = 0; i < 24; i++) p += ownCount(s, c, i) * (i + 1);
  return p;
}

function checkerTotal(s, c) {
  let n = s.bar[c] + s.off[c];
  for (let i = 0; i < 24; i++) n += ownCount(s, c, i);
  return n;
}

/** If `winner` has borne off all checkers: 1 single, 2 gammon, 3 backgammon. */
function winMultiplier(s, winner) {
  const loser = other(winner);
  if (s.off[loser] > 0) return 1;
  if (s.bar[loser] > 0) return 3;
  // Loser checkers inside the winner's home board (loser own idx 18..23).
  for (let i = 18; i < 24; i++) if (ownCount(s, loser, i) > 0) return 3;
  return 2;
}

function sameMoves(a, b) {
  if (a.length !== b.length) return false;
  for (let i = 0; i < a.length; i++) {
    if (a[i].from !== b[i].from || a[i].to !== b[i].to) return false;
  }
  return true;
}

/** Finds the legal sequence matching submitted moves (by from/to), or the same resulting position. */
function matchSequence(legal, s, c, moves) {
  const exact = legal.find((l) => sameMoves(l.moves, moves));
  if (exact) return exact;
  // Accept any ordering of the same checker moves that yields a legal end position.
  try {
    let st = s;
    for (const m of moves) {
      if (typeof m.from !== 'number' || typeof m.to !== 'number') return null;
      st = applyMove(st, c, m);
    }
    const k = stateKey(st);
    if (moves.length !== (legal[0]?.moves.length ?? 0)) return null;
    return legal.find((l) => stateKey(l.state) === k) || null;
  } catch {
    return null;
  }
}

// ---- engine/game.js ----
// Game & match flow (pure, deterministic given a dice function).

const MAX_CUBE = 64;

/**
 * One game of backgammon.
 * diceFn(rollIndex) -> [d1, d2]  (deterministic stream; see server/dice.js)
 * Phases: 'roll' -> 'move' -> ... ; 'doubled' while a cube offer is pending; 'over'.
 */
class Game {
  constructor({ diceFn, cubeEnabled = true, crawford = false }) {
    this.diceFn = diceFn;
    this.cubeEnabled = cubeEnabled && !crawford;
    this.crawford = crawford;
    this.state = initialState();
    this.cube = { value: 1, owner: null };
    this.rollIndex = 0;
    this.turn = null;
    this.dice = null;
    this.phase = 'init';
    this.legal = null;
    this.result = null; // { winner, multiplier, points, reason }
    this.log = [];
    this.plies = 0;
    this._opening();
  }

  _nextRoll() {
    const r = this.diceFn(this.rollIndex);
    this.rollIndex++;
    return r;
  }

  _opening() {
    let d;
    do { d = this._nextRoll(); } while (d[0] === d[1]);
    this.turn = d[0] > d[1] ? 'w' : 'b';
    this._startMove(d);
    this.log.push({ t: 'opening', dice: d, turn: this.turn });
  }

  _startMove(dice) {
    this.dice = dice;
    this.legal = legalSequences(this.state, this.turn, dice);
    this.phase = 'move';
    if (this.legal.length === 1 && this.legal[0].moves.length === 0) {
      this.log.push({ t: 'pass', color: this.turn, dice });
      this._endTurn();
    }
  }

  _endTurn() {
    this.plies++;
    this.turn = other(this.turn);
    this.dice = null;
    this.legal = null;
    this.phase = 'roll';
  }

  canDouble(color) {
    return this.phase === 'roll' && this.turn === color && this.cubeEnabled
      && this.cube.value < MAX_CUBE && (this.cube.owner === null || this.cube.owner === color);
  }

  /** True when the player on roll has no cube decision (so the server may auto-roll). */
  rollIsForced() {
    return this.phase === 'roll' && !this.canDouble(this.turn);
  }

  roll(color) {
    if (this.phase !== 'roll' || this.turn !== color) throw new Error('not your roll');
    const d = this._nextRoll();
    this.log.push({ t: 'roll', color, dice: d });
    this._startMove(d);
    return d;
  }

  move(color, moves) {
    if (this.phase !== 'move' || this.turn !== color) throw new Error('not your move');
    const seq = matchSequence(this.legal, this.state, color, moves);
    if (!seq) throw new Error('illegal move');
    this.state = seq.state;
    this.log.push({ t: 'move', color, dice: this.dice, moves: seq.moves });
    if (this.state.off[color] === 15) {
      const mult = winMultiplier(this.state, color);
      this._finish(color, mult, mult === 1 ? 'single' : mult === 2 ? 'gammon' : 'backgammon');
    } else {
      this._endTurn();
    }
    return seq;
  }

  double(color) {
    if (!this.canDouble(color)) throw new Error('cannot double');
    this.phase = 'doubled';
    this.log.push({ t: 'double', color, value: this.cube.value * 2 });
  }

  take(color) {
    if (this.phase !== 'doubled' || this.turn === color) throw new Error('no double to take');
    this.cube = { value: this.cube.value * 2, owner: color };
    this.phase = 'roll';
    this.log.push({ t: 'take', color });
  }

  drop(color) {
    if (this.phase !== 'doubled' || this.turn === color) throw new Error('no double to drop');
    this.log.push({ t: 'drop', color });
    this._finish(other(color), 1, 'drop');
  }

  resign(color) {
    if (this.phase === 'over') throw new Error('game over');
    // Resigning concedes what the opponent would win if the game ended now
    // (gammon if the resigner has borne off nothing) — prevents gammon-dodging.
    const winner = other(color);
    const mult = this.state.off[color] > 0 ? 1 : 2;
    this.log.push({ t: 'resign', color });
    this._finish(winner, mult, 'resign');
  }

  _finish(winner, multiplier, reason) {
    this.phase = 'over';
    this.dice = null;
    this.legal = null;
    this.result = { winner, multiplier, points: multiplier * this.cube.value, reason };
  }

  pips() {
    return { w: pipCount(this.state, 'w'), b: pipCount(this.state, 'b') };
  }

  snapshot() {
    return {
      state: this.state,
      cube: this.cube,
      cubeEnabled: this.cubeEnabled,
      crawford: this.crawford,
      turn: this.turn,
      dice: this.dice,
      phase: this.phase,
      result: this.result,
      pips: this.pips(),
      rollIndex: this.rollIndex,
    };
  }
}

/**
 * Classic match to `target` points between seats A and B.
 * Seat A plays white in odd games, black in even games (colors alternate).
 * gameDiceFn(gameIndex) -> diceFn
 */
class ClassicMatch {
  constructor({ target = 5, cube = true, gameDiceFn }) {
    this.kind = 'classic';
    this.target = target;
    this.cube = cube;
    this.gameDiceFn = gameDiceFn;
    this.score = { A: 0, B: 0 };
    this.crawfordUsed = false;
    this.games = [];
    this.over = false;
    this.winner = null;
    this._newGame();
  }

  colorOf(seat, gi = this.games.length - 1) {
    const aWhite = gi % 2 === 0;
    return (seat === 'A') === aWhite ? 'w' : 'b';
  }

  seatOf(color, gi = this.games.length - 1) {
    return this.colorOf('A', gi) === color ? 'A' : 'B';
  }

  _newGame() {
    const gi = this.games.length;
    let crawford = false;
    if (this.target > 1 && !this.crawfordUsed
      && (this.score.A === this.target - 1 || this.score.B === this.target - 1)) {
      crawford = true;
      this.crawfordUsed = true;
    }
    const g = new Game({ diceFn: this.gameDiceFn(gi), cubeEnabled: this.cube && this.target > 1, crawford });
    this.games.push(g);
    return g;
  }

  /** Boards in play (always one for classic). */
  boards() { return [this.current()]; }
  current() { return this.games[this.games.length - 1]; }

  /** Call after any action; rolls over to next game when one ends. Returns true if a game just ended. */
  settle() {
    const g = this.current();
    if (g.phase !== 'over' || this.over) return false;
    const seat = this.seatOf(g.result.winner);
    this.score[seat] += g.result.points;
    if (this.score[seat] >= this.target) {
      this.over = true;
      this.winner = seat;
    } else {
      this._newGame();
    }
    return true;
  }
}

/**
 * Duplicate match: `pairs` rounds; in each round two boards are played at the
 * same time with the SAME dice stream. Board 1: A = white. Board 2: A = black.
 * Because both boards consume the identical roll sequence by roll index, each
 * player faces exactly the dice their opponent faced on the other board, so
 * luck cancels out. Total points over all boards decide the match.
 * Ties go to sudden-death extra rounds (up to maxExtra), then to the skill
 * tiebreak supplied by the caller (lower average engine-measured error).
 */
class DuplicateMatch {
  constructor({ pairs = 1, cube = false, gameDiceFn, maxExtra = 2 }) {
    this.kind = 'duplicate';
    this.pairs = pairs;
    this.cube = cube;
    this.gameDiceFn = gameDiceFn;
    this.maxExtra = maxExtra;
    this.score = { A: 0, B: 0 };
    this.rounds = [];
    this.over = false;
    this.winner = null; // 'A' | 'B' | 'draw'
    this.tiebreak = null;
    this._newRound();
  }

  colorOf(seat, board) {
    return (seat === 'A') === (board === 0) ? 'w' : 'b';
  }

  seatOf(color, board) {
    return this.colorOf('A', board) === color ? 'A' : 'B';
  }

  _newRound() {
    const ri = this.rounds.length;
    const diceFn = this.gameDiceFn(ri);
    this.rounds.push([
      new Game({ diceFn, cubeEnabled: this.cube }),
      new Game({ diceFn, cubeEnabled: this.cube }),
    ]);
  }

  boards() { return this.rounds[this.rounds.length - 1]; }

  settle() {
    const round = this.boards();
    if (this.over || round.some((g) => g.phase !== 'over')) return false;
    if (round._settled) return false;
    round._settled = true;
    round.forEach((g, b) => {
      this.score[this.seatOf(g.result.winner, b)] += g.result.points;
    });
    const played = this.rounds.length;
    if (played >= this.pairs) {
      if (this.score.A !== this.score.B) {
        this.over = true;
        this.winner = this.score.A > this.score.B ? 'A' : 'B';
      } else if (played >= this.pairs + this.maxExtra) {
        this.over = true;
        this.winner = 'draw';
      } else {
        this._newRound();
      }
    } else {
      this._newRound();
    }
    return true;
  }
}

// ---- engine/bot.js ----
// Heuristic backgammon AI with adjustable strength (pure JS).
// Strength is controlled by evaluation noise: the same evaluator is used at
// every level, weaker levels add random error to each candidate's score.
// The noiseless evaluator also powers the anti-cheat / move-quality metric.

const LEVELS = {
  expert: { noise: 0, label: 'מומחה' },
  strong: { noise: 3, label: 'חזק' },
  intermediate: { noise: 8, label: 'בינוני' },
  beginner: { noise: 20, label: 'מתחיל' },
  random: { noise: Infinity, label: 'אקראי' },
};

const ROLLS = [];
for (let a = 1; a <= 6; a++) for (let b = a; b <= 6; b++) ROLLS.push([a, b, a === b ? 1 : 2]);

/** Is own point i blocked for `c` (opponent has 2+)? */
const blocked = (s, c, i) => i >= 0 && i <= 23 && oppCount(s, c, i) >= 2;

/**
 * Probability (0..1) that opponent hits c's blot at own index i next roll.
 * Approximation: considers direct and combination shots, intermediate landing
 * points, ignores bar-entry restrictions for the hitter.
 */
function shotProbability(s, c, i) {
  const o = other(c);
  // Opponent checkers positions in opponent's own perspective; blot position in o's perspective:
  const target = 23 - i;
  const hitters = [];
  if (s.bar[o] > 0) hitters.push(24);
  for (let j = target + 1; j < 24; j++) if (ownCount(s, o, j) > 0) hitters.push(j);
  if (!hitters.length) return 0;
  // Blocked check for the hitter (o) at its own index k means c has 2+ there.
  const blk = (k) => k >= 0 && k <= 23 && ownCount(s, c, 23 - k) >= 2;
  let hits = 0;
  for (const [a, b, w] of ROLLS) {
    let hit = false;
    for (const h of hitters) {
      const d = h - target;
      if (a !== b) {
        if (d === a || d === b) { hit = true; break; }
        if (d === a + b && (!blk(h - a) || !blk(h - b))) { hit = true; break; }
      } else {
        for (let k = 1; k <= 4; k++) {
          if (blk(h - a * k) && k * a < d) break;
          if (d === a * k) { hit = true; break; }
        }
        if (hit) break;
      }
    }
    if (hit) hits += w;
  }
  return hits / 36;
}

function hasContact(s, c) {
  // c's rearmost checker (own idx) vs opponent's rearmost checker expressed in c's own coords.
  let myBack = -1;
  if (s.bar[c] > 0) myBack = 24;
  else for (let i = 23; i >= 0; i--) if (ownCount(s, c, i) > 0) { myBack = i; break; }
  const o = other(c);
  if (s.bar[o] > 0) return true;
  let oppBackInMine = 24;
  for (let i = 0; i < 24; i++) if (oppCount(s, c, i) > 0) { oppBackInMine = i; break; }
  return myBack > oppBackInMine;
}

/** Static evaluation of position `s` from the perspective of `c` who just moved. Higher = better. */
function evaluate(s, c) {
  const o = other(c);
  if (s.off[c] === 15) return 1000;
  const myPip = pipCount(s, c);
  const opPip = pipCount(s, o);

  if (!hasContact(s, c)) {
    // Pure race: pips dominate; small penalty for checkers far from home & gaps.
    let waste = 0;
    for (let i = 6; i < 24; i++) waste += ownCount(s, c, i) * 0.5;
    return (opPip - myPip) * 1.2 + s.off[c] * 1.5 - waste;
  }

  let score = (opPip - myPip) * 0.6;
  // Made points & primes.
  let run = 0; let best = 0; let homeMade = 0;
  for (let i = 0; i < 24; i++) {
    const n = ownCount(s, c, i);
    if (n >= 2) {
      run++; best = Math.max(best, run);
      if (i <= 5) { homeMade++; score += 3; }
      if (i === 6) score += 3;
      if (i === 3 || i === 4) score += 2.5;
      if (i >= 18) score += 2.5; // anchor in opponent's home board
      if (i > 6 && i < 18) score += 1.2;
      if (n > 3) score -= (n - 3) * 0.5; // stacking
    } else {
      run = 0;
    }
  }
  score += best * best * 1.3;

  // Blot exposure.
  for (let i = 0; i < 24; i++) {
    if (ownCount(s, c, i) === 1) {
      const p = shotProbability(s, c, i);
      score -= p * ((24 - i) * 0.55 + 5 + homeMadeOpp(s, o) * 1.5);
    }
  }

  // Opponent checkers on the bar are worth more against a strong home board.
  score += s.bar[o] * (6 + homeMade * 2.5);
  score -= s.bar[c] * 6;
  score += s.off[c] * 1.5;
  return score;
}

function homeMadeOpp(s, o) {
  let n = 0;
  for (let i = 0; i <= 5; i++) if (ownCount(s, o, i) >= 2) n++;
  return n;
}

function gauss(rng) {
  const u = 1 - rng(); const v = rng();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

/** Scores every legal sequence with the noiseless evaluator. */
function scoreSequences(legal, c) {
  return legal.map((l) => evaluate(l.state, c));
}

/** Choose a sequence index for `level`. rng: () => [0,1). */
function chooseSequence(legal, c, level = 'expert', rng = Math.random) {
  if (legal.length === 1) return 0;
  const noise = (LEVELS[level] ?? LEVELS.expert).noise;
  if (noise === Infinity) return Math.floor(rng() * legal.length);
  let bestI = 0; let bestV = -Infinity;
  for (let i = 0; i < legal.length; i++) {
    const v = evaluate(legal[i].state, c) + (noise ? gauss(rng) * noise : 0);
    if (v > bestV) { bestV = v; bestI = i; }
  }
  return bestI;
}

/** Rough "position strength" for cube decisions, from c's perspective (c on roll). */
function cubeView(s, c) {
  const myPip = pipCount(s, c);
  const opPip = pipCount(s, other(c));
  if (!hasContact(s, c) && !hasContact(s, other(c))) {
    return { race: true, lead: (opPip - myPip) / Math.max(myPip, 1) };
  }
  return { race: false, score: evaluate(s, c) - evaluate(s, other(c)) };
}

function shouldDouble(s, c, level = 'expert') {
  if (level === 'random') return false;
  const v = cubeView(s, c);
  return v.race ? v.lead > 0.09 && v.lead < 0.25 : v.score > 30 && v.score < 70;
}

function shouldTake(s, c, level = 'expert') {
  if (level === 'random') return Math.random() < 0.5;
  // c is the one being doubled, opponent is on roll.
  const v = cubeView(s, other(c));
  return v.race ? v.lead < 0.2 : v.score < 60;
}

/** Equity-like loss of a chosen sequence vs the best (noiseless). Used for move-quality stats. */
function moveError(legal, c, chosenIndex) {
  if (legal.length <= 1) return { error: 0, rank: 0, forced: true };
  const scores = scoreSequences(legal, c);
  const best = Math.max(...scores);
  const chosen = scores[chosenIndex];
  const rank = scores.filter((x) => x > chosen).length;
  return { error: best - chosen, rank, forced: false };
}

// Autoplay a game with bots (used by the live experiment).
function autoplay(g, levelOf) {
  let guard = 0;
  while (g.phase !== 'over' && guard++ < 3000) {
    if (g.phase === 'roll') g.roll(g.turn);
    else if (g.phase === 'move') { const i = chooseSequence(g.legal, g.turn, levelOf(g.turn)); g.move(g.turn, g.legal[i].moves); }
  }
}

// GAME CONTROLLER
// =====================================================================
function hash32(a, b, c, d) { let x = 0x9e3779b9 ^ a; for (const y of [b, c, d]) { x = Math.imul(x ^ y, 0x85ebca6b); x ^= x >>> 13; x = Math.imul(x, 0xc2b2ae35); x ^= x >>> 16; } return x >>> 0; }

const LEVEL_NAME = { beginner: 'בוט מתחיל', intermediate: 'בוט בינוני', strong: 'בוט חזק', expert: 'בוט מומחה' };

function startPractice() { startMatch({ ...st.setup, oppName: LEVEL_NAME[st.setup.level], label: 'שולחן אימון', cash: false }); }

function startMatch(cfg, onEnd = null) {

  G.cfg = cfg; G.onEnd = onEnd; G.ended = false;
  G.M = cfg.mode === 'duplicate'

  G.partial = new Map(); G.selected = null; G.last = new Map(); G.rolled = new Set();
  st.screen = 'table';
  step();
}

const colorOf = (seat, b) => (G.M.kind === 'duplicate' ? G.M.colorOf(seat, b) : G.M.colorOf(seat));
const seatOf = (color, b) => (G.M.kind === 'duplicate' ? G.M.seatOf(color, b) : G.M.seatOf(color));
const actor = (g, b) => (g.phase === 'over' ? null : seatOf(g.phase === 'doubled' ? other(g.turn) : g.turn, b));

function step() {
  const before = G.M.kind === 'duplicate' ? G.M.rounds.length : G.M.games.length;
  G.M.settle();
  const after = G.M.kind === 'duplicate' ? G.M.rounds.length : G.M.games.length;
  if (after !== before) { G.partial = new Map(); G.last = new Map(); toast(G.M.kind === 'duplicate' ? `סבב ${after} מתחיל` : `משחק ${after} מתחיל`); }
  if (st.screen === 'table') render();
  if (G.M.over) { if (!G.ended) { G.ended = true; finishMatch(); } return; }
  G.M.boards().forEach((g, b) => {
    const seat = actor(g, b);
    if (!seat) return;
    const key = b + ':' + seat;
    if (G.pending.has(key)) return;
    if (seat === 'B') { G.pending.add(key); const m0 = G.M; G.timers.push(setTimeout(() => { G.pending.delete(key); if (G.M === m0) botStep(g, b); }, 650)); }
    else if (g.phase === 'roll' && g.rollIsForced()) { G.pending.add(key); const m0 = G.M; G.timers.push(setTimeout(() => { G.pending.delete(key); if (G.M === m0 && g.phase === 'roll' && actor(g, b) === 'A') { g.roll(g.turn); sfx.dice(); step(); } }, 380)); }
  });
}

function recordLast(b, color, moves, before) {
  G.last.set(b, { color, moves });
  if (before && moves.some((m) => m.to !== OFF && oppCount(before, color, m.to) === 1)) sfx.hit(); else sfx.click();
}

function botStep(g, b) {
  if (g.phase === 'over' || actor(g, b) !== 'B') return;
  const lv = G.cfg.level;
  if (g.phase === 'doubled') { const me = colorOf('B', b); if (shouldTake(g.state, me, lv)) { g.take(me); toast('הבוט קיבל את ההכפלה'); } else { g.drop(me); toast('הבוט ויתר'); } }
  else if (g.phase === 'roll') { if (g.canDouble(g.turn) && shouldDouble(g.state, g.turn, lv)) { g.double(g.turn); toast(`הבוט מכפיל ל-${g.cube.value * 2}`); } else { g.roll(g.turn); sfx.dice(); } }
  else if (g.phase === 'move') { const c = g.turn; const before = g.state; const i = chooseSequence(g.legal, c, lv); const mv = g.legal[i].moves; g.move(c, mv); recordLast(b, c, mv, before); }

}

function finishMatch() {
  const M = G.M;
  const won = M.winner === 'A'; const draw = M.winner === 'draw';
  st.stats.played++; if (won) st.stats.won++; store.set('stats', st.stats);
  if (won) { sfx.win(); confetti(); } else if (!draw) sfx.lose();
  const next = G.onEnd;
  const close = () => { $('.overlay')?.remove(); if (next) next(M.winner); else go('lobby'); };
  const again = () => { $('.overlay')?.remove(); startMatch(G.cfg, G.onEnd); };
  document.body.append(h('div', { class: 'overlay', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'ov-t' },
    h('div', { class: 'card' },
      h('h2', { id: 'ov-t' }, draw ? 'תיקו!' : won ? 'ניצחת!' : 'הפסד'),
      h('div', { class: 'num', style: 'font-family:var(--display);font-size:2rem' }, `${M.score.A} : ${M.score.B}`),
      h('p', { class: 'muted' }, draw ? 'שיחקתם באותה רמה בדיוק, עם אותן קוביות.' : M.kind === 'duplicate' ? 'עם אותן קוביות בדיוק. ההבדל היה במהלכים.' : won ? 'יפה מאוד.' : 'הקוביות היו אותן קוביות. נסה שוב.'),
      h('div', { class: 'acts', style: 'justify-content:center' },
        next ? h('button', { class: 'btn', onclick: close }, 'המשך בטורניר') : [h('button', { class: 'btn', onclick: again }, 'עוד משחק'), h('button', { class: 'btn ghost', onclick: close }, 'ללובי')]))));
}

// ----- human move entry -----
const fullDice = (d) => (d[0] === d[1] ? [d[0], d[0], d[0], d[0]] : [...d]);
function getPartial(g, b) {
  let p = G.partial.get(b);

}

    if (tried.has(rem[i])) continue; tried.add(rem[i]);

}

    for (const from of sourcesOf(p.state, c)) {

  if (p.moves.length === g.legal[0].moves.length) {

}

    if (ch.length) { playMove(g, b, ch[0]); return; }

    const dests = [...new Set(from.map((m) => m.to))];
    if (dests.length === 1 && G.selected?.b === b && G.selected.from === idx) { playMove(g, b, from[0]); return; }
    G.selected = { b, from: idx };

  render();
}

  const last = G.last.get(b);
  const lastPts = new Set();
  if (last && !moving) for (const m of last.moves) { lastPts.add(toOwn(me, toAbs(last.color, m.from === BAR ? 24 : m.from))); if (m.to !== OFF) lastPts.add(toOwn(me, toAbs(last.color, m.to))); }

// =====================================================================
// WALLET (demo money · no payment terminal)

function validIsraeliId(id) {
  const s = String(id || '').replace(/\D/g, ''); if (s.length < 5 || s.length > 9) return false;
  const p = s.padStart(9, '0'); let sum = 0;
  for (let i = 0; i < 9; i++) { let d = Number(p[i]) * ((i % 2) + 1); if (d > 9) d -= 9; sum += d; }
  return sum % 10 === 0;
}
function ledger(kind, amount, note) { st.wallet.balance += amount; st.wallet.history.unshift({ at: Date.now(), kind, amount, note }); st.wallet.history = st.wallet.history.slice(0, 40); saveWallet(); }
const DAY = 86400000;
const sumKind = (kinds, ms) => st.wallet.history.filter((x) => kinds.includes(x.kind) && Date.now() - x.at < ms).reduce((a, x) => a + x.amount, 0);
function excluded() { return st.wallet.excludedUntil && st.wallet.excludedUntil > Date.now(); }

function viewWallet() {
  const w = st.wallet;
  const kyc = w.kyc;
  const kycPanel = kyc
    ? h('div', { class: 'panel' }, h('div', { class: 'eyebrow' }, 'אימות זהות'), h('h3', {}, '✅ מאומת'), h('p', { class: 'muted' }, `${kyc.name} · ת"ז ‎•••••${kyc.last3}`), h('p', { class: 'faint' }, 'בגרסה האמיתית האימות מתבצע מול ספק אימות זהות, ונשמר רק המינימום הנדרש.'))
    : h('form', { class: 'panel', onsubmit: (e) => {
      e.preventDefault(); const f = e.target.elements;
      const name = f.kname.value.trim(); const id = f.kid.value; const dob = new Date(f.kdob.value);
      if (name.split(/\s+/).length < 2) return toast('יש להזין שם פרטי ושם משפחה');
      if (!validIsraeliId(id)) return toast('מספר תעודת הזהות לא תקין (ספרת ביקורת)');
      if (!(Date.now() - dob.getTime() >= 18 * 365.2425 * DAY)) return toast('משחק בכסף מגיל 18 בלבד');
      w.kyc = { name, last3: String(id).slice(-3), at: Date.now() }; saveWallet(); toast('הזהות אומתה (הדגמה)'); render();
    } },
    h('div', { class: 'eyebrow' }, 'שלב 1'), h('h3', { style: 'font-family:var(--display);font-size:1.4rem' }, 'אימות זהות'),
    h('p', { class: 'muted' }, 'משחק בכסף מותר רק אחרי אימות זהות וגיל 18 ומעלה. אחד לכל אדם.'),
    h('div', { class: 'row' },
      h('label', { class: 'f', for: 'kname' }, 'שם מלא', h('input', { id: 'kname', name: 'kname', required: true, autocomplete: 'name' })),
      h('label', { class: 'f', for: 'kid' }, 'תעודת זהות', h('input', { id: 'kid', name: 'kid', inputmode: 'numeric', required: true, placeholder: '9 ספרות' })),
      h('label', { class: 'f', for: 'kdob' }, 'תאריך לידה', h('input', { id: 'kdob', name: 'kdob', type: 'date', required: true }))),
    h('div', { class: 'acts' }, h('button', { class: 'btn' }, 'אמת זהות'), h('span', { class: 'faint' }, 'לבדיקה: 000000018')));

  const amounts = [5000, 10000, 20000];
  const dep = (a) => {
    if (!w.kyc) return toast('צריך לאמת זהות קודם');
    if (excluded()) return toast('החשבון בהחרגה עצמית');
    if (w.limits.depositDaily != null && sumKind(['deposit'], DAY) + a > w.limits.depositDaily) return toast('חריגה ממגבלת ההפקדה היומית');
    ledger('deposit', a, 'הפקדה (הדגמה, בלי מסוף סליקה)'); toast(`הופקדו ${shekel(a)} של כסף מדומה`); render();
  };
  return h('div', { class: 'lobby' },
    h('div', { class: 'lobby-hero' }, h('div', {}, h('div', { class: 'eyebrow' }, 'ארנק'), h('h2', {}, 'הארנק שלי')), h('button', { class: 'btn ghost sm', onclick: () => go('lobby') }, 'ללובי')),
    h('div', { class: 'notice' }, 'הדגמה: הכסף כאן מדומה ומסוף הסליקה לא מחובר. כל התהליכים (אימות, הפקדה, מגבלות, דמי כניסה, עמלה, מס ומשיכה) עובדים כמו בגרסה האמיתית, שתיפתח רק אחרי אישור משפטי.'),
    h('div', { class: 'grid2' },
      h('div', { class: 'panel' },
        h('div', { class: 'eyebrow' }, 'יתרה'), h('div', { class: 'balance num' }, shekel(w.balance)),
        h('div', { class: 'faint num' }, `הופקד ב-24 שעות: ${shekel(sumKind(['deposit'], DAY))} · הפסד נטו ב-30 יום: ${shekel(Math.max(0, -sumKind(['entry', 'prize', 'refund'], 30 * DAY)))}`),
        h('div', { class: 'acts', style: 'margin-top:12px' }, amounts.map((a) => h('button', { class: 'btn sm', onclick: () => dep(a), disabled: !w.kyc || excluded() }, `הפקד ${shekel(a)}`))),
        h('div', { class: 'acts', style: 'margin-top:8px' }, h('button', { class: 'btn ghost sm', disabled: !w.kyc || w.balance < 5000, onclick: () => { ledger('withdraw', -w.balance, 'משיכה לחשבון בנק על שם בעל החשבון (הדגמה)'); toast('בקשת המשיכה התקבלה'); render(); } }, 'משוך הכל'),
          h('span', { class: 'faint' }, 'משיכה רק לחשבון בנק על שם בעל החשבון המאומת. מינימום ₪50.'))),
      kycPanel,
      h('form', { class: 'panel', onsubmit: (e) => {
        e.preventDefault(); const f = e.target.elements;
        const val = (x) => (x.value === '' ? null : Math.round(Number(x.value) * 100));
        const nd = val(f.ldep); const nl = val(f.lloss);
        const raise = (o, n) => o != null && (n == null || n > o);
        if (raise(w.limits.depositDaily, nd) || raise(w.limits.lossMonthly, nl)) toast('העלאת מגבלה תיכנס לתוקף בעוד 24 שעות (בגרסה האמיתית)');
        else toast('המגבלות עודכנו');
        if (!raise(w.limits.depositDaily, nd)) w.limits.depositDaily = nd;
        if (!raise(w.limits.lossMonthly, nl)) w.limits.lossMonthly = nl;
        saveWallet(); render();
      } },
      h('div', { class: 'eyebrow' }, 'משחק אחראי'), h('h3', { style: 'font-family:var(--display);font-size:1.4rem' }, 'מגבלות'),
      h('div', { class: 'row' },
        h('label', { class: 'f', for: 'ldep' }, 'הפקדה יומית (₪)', h('input', { id: 'ldep', name: 'ldep', type: 'number', min: 0, value: w.limits.depositDaily == null ? '' : w.limits.depositDaily / 100 })),
        h('label', { class: 'f', for: 'lloss' }, 'הפסד חודשי (₪)', h('input', { id: 'lloss', name: 'lloss', type: 'number', min: 0, value: w.limits.lossMonthly == null ? '' : w.limits.lossMonthly / 100 }))),
      h('div', { class: 'acts' }, h('button', { class: 'btn sm' }, 'שמור'),
        h('button', { type: 'button', class: 'btn red sm', onclick: () => { w.excludedUntil = Date.now() + 7 * DAY; saveWallet(); toast('החשבון הוחרג ל-7 ימים'); render(); } }, 'החרגה עצמית (7 ימים)')),
      excluded() ? h('p', { class: 'notice warn' }, `בהחרגה עצמית עד ${new Date(w.excludedUntil).toLocaleDateString('he-IL')}`) : null,
      h('p', { class: 'faint' }, 'הורדת מגבלה חלה מיד. העלאה רק אחרי 24 שעות. אי אפשר לבטל החרגה לפני הזמן.')),
      h('div', { class: 'panel' }, h('div', { class: 'eyebrow' }, 'תנועות'),
        w.history.length ? h('table', { class: 'hist' }, h('tbody', {}, w.history.map((x) => h('tr', {}, h('td', {}, new Date(x.at).toLocaleDateString('he-IL')), h('td', {}, x.note), h('td', { class: x.amount >= 0 ? 'plus' : 'minus' }, (x.amount >= 0 ? '+' : '') + shekel(x.amount))))))
          : h('p', { class: 'muted' }, 'אין עדיין תנועות.')),
    ));
}

// =====================================================================
// CASH TOURNAMENTS (demo)
// =====================================================================
const TOURS = [
  { id: 'dup20', name: 'כפול ₪20', mode: 'duplicate', len: 2, fee: 2000, desc: 'שש בש כפול · 2 סבבים (4 לוחות)' },
  { id: 'c7_50', name: 'מאץ\' ₪50', mode: 'classic', len: 7, fee: 5000, desc: 'קלאסי · מאץ\' עד 7 עם קוביית הכפלה' },
];
const RAKE = 10; const TAX = 0.25; const SPLIT = [0.7, 0.3];
const OPP = [['דני', 'intermediate'], ['מאיה', 'strong'], ['יוסי', 'beginner'], ['רונית', 'intermediate'], ['אבי', 'strong'], ['נועה', 'beginner']];

function payoutPlan(fee) {
  const pool = fee * 4; const rake = Math.floor(pool * RAKE / 100); const net = pool - rake;
  const first = Math.floor(net * SPLIT[0]); const second = net - first;
  const tax = (gross) => Math.floor(Math.max(0, gross - fee) * TAX);
  return { pool, rake, net, first, second, tax1: tax(first), tax2: tax(second) };
}

function viewTours() {
  const t = st.tour;
  if (t) return viewTourProgress(t);
  return h('div', { class: 'lobby' },
    h('div', { class: 'lobby-hero' }, h('div', {}, h('div', { class: 'eyebrow' }, 'טורנירים'), h('h2', {}, 'טורנירים על כסף')), h('button', { class: 'btn ghost sm', onclick: () => go('lobby') }, 'ללובי')),
    h('div', { class: 'notice' }, 'הדגמה: הכסף מדומה. בגרסה האמיתית משחקים רק מול בני אדם. כאן, כדי להראות את התהליך, היריבים הם בוטים עם שמות.'),
    h('div', { class: 'grid2' }, TOURS.map((tt) => {
      const pp = payoutPlan(tt.fee);
      return h('div', { class: 'panel tcard' },
        h('div', { class: 'eyebrow' }, '4 שחקנים · הדחה'), h('h3', {}, tt.name), h('div', { class: 'muted' }, tt.desc),
        h('dl', { class: 'kv num' },
          h('dt', {}, 'דמי כניסה'), h('dd', {}, shekel(tt.fee)),
          h('dt', {}, 'קופה'), h('dd', {}, shekel(pp.pool)),
          h('dt', {}, `עמלת מערכת ${RAKE}%`), h('dd', {}, shekel(pp.rake)),
          h('dt', {}, 'מקום 1 · 70%'), h('dd', {}, `${shekel(pp.first)} (נטו ${shekel(pp.first - pp.tax1)})`),
          h('dt', {}, 'מקום 2 · 30%'), h('dd', {}, `${shekel(pp.second)} (נטו ${shekel(pp.second - pp.tax2)})`),
          h('dt', {}, 'מס'), h('dd', {}, `${TAX * 100}% מהרווח נטו, בניכוי במקור`),
          h('dt', {}, 'שובר שוויון'), h('dd', {}, 'איכות מהלכים, לא הגרלה')),
        h('p', { class: 'faint' }, 'הכללים נקבעים לפני ההרשמה ולא משתנים אחריה.'),
        h('button', { class: 'btn', onclick: () => joinTour(tt) }, `הירשם · ${shekel(tt.fee)}`));
    })),
    h('p', { class: 'faint' }, 'שיעור המס מוצג לצורך ההדגמה בלבד ויאומת מול רואה חשבון.'));
}

function joinTour(tt) {
  const w = st.wallet;
  if (!w.kyc) { toast('צריך לאמת זהות בארנק'); return go('wallet'); }
  if (excluded()) return toast('החשבון בהחרגה עצמית');
  if (w.balance < tt.fee) { toast('אין מספיק יתרה. הפקד בארנק'); return go('wallet'); }
  const lossNow = Math.max(0, -sumKind(['entry', 'prize', 'refund'], 30 * DAY));
  if (w.limits.lossMonthly != null && lossNow + tt.fee > w.limits.lossMonthly) return toast('חריגה ממגבלת ההפסד החודשית שהגדרת');
  ledger('entry', -tt.fee, `דמי כניסה · ${tt.name}`);
  const pool = OPP.slice().sort(() => Math.random() - .5).slice(0, 3).map(([name, level]) => ({ name, level }));
  st.tour = { def: tt, opps: pool, stage: 'semi', semi2: null, finalOpp: null, result: null };
  render();
}

function viewTourProgress(t) {
  const [o1, o2, o3] = t.opps;
  const sim = () => (Math.random() < 0.5 ? o2 : o3); // other semifinal (shown as completed)
  t.semi2 ??= sim();
  const m = (a, b, w) => h('div', { class: 'm' }, h('div', { class: w === a ? 'w' : '' }, a), h('div', { class: w === b ? 'w' : '' }, b));
  const pp = payoutPlan(t.def.fee);
  const semiWinner = t.stage === 'semi' ? null : t.semiResult === 'A' ? 'אתה' : o1.name;
  const finalWinner = t.result ? (t.result.place === 1 ? 'אתה' : t.result.place === 2 ? t.semi2.name : null) : null;
  const playSemi = () => startMatch({ mode: t.def.mode, len: t.def.len, level: o1.level, oppName: o1.name, label: t.def.name, cash: true }, (winner) => {
    t.semiResult = winner === 'draw' ? (Math.random() < .5 ? 'A' : 'B') : winner; // demo tiebreak stands in for move-quality
    if (t.semiResult === 'A') t.stage = 'final';
    else { t.stage = 'done'; t.result = { place: 0 }; }
    st.screen = 'tours'; render();
  });
  const playFinal = () => startMatch({ mode: t.def.mode, len: t.def.len, level: t.semi2.level, oppName: t.semi2.name, label: t.def.name + ' · גמר', cash: true }, (winner) => {
    const won = winner === 'A' || (winner === 'draw' && Math.random() < .5);
    const gross = won ? pp.first : pp.second; const tax = won ? pp.tax1 : pp.tax2;
    ledger('prize', gross - tax, `פרס מקום ${won ? 1 : 2} · ${t.def.name} (אחרי ניכוי מס ${shekel(tax)})`);
    t.stage = 'done'; t.result = { place: won ? 1 : 2, gross, tax };
    if (won) { confetti(); sfx.win(); }
    st.screen = 'tours'; render();
  });
  return h('div', { class: 'lobby' },
    h('div', { class: 'lobby-hero' }, h('div', {}, h('div', { class: 'eyebrow' }, 'טורניר פעיל'), h('h2', {}, t.def.name)), h('div', { class: 'chip cash num' }, `קופה ${shekel(pp.pool)}`)),
    h('div', { class: 'grid2' },
      h('div', { class: 'panel' }, h('div', { class: 'eyebrow', style: 'margin-bottom:8px' }, 'הטבלה'),
        h('div', { class: 'bracket' },
          h('div', { style: 'display:grid;gap:10px' }, m('אתה', o1.name, semiWinner), m(o2.name, o3.name, t.stage === 'semi' ? null : t.semi2.name)),
          h('div', {}, h('div', { class: 'faint', style: 'margin-bottom:4px' }, 'גמר'), t.stage === 'semi' ? h('div', { class: 'm muted' }, 'ממתין…') : m(semiWinner === 'אתה' ? 'אתה' : o1.name, t.semi2.name, finalWinner)))),
      h('div', { class: 'panel' },
        t.stage === 'semi' ? [h('h3', { style: 'font-family:var(--display);font-size:1.5rem' }, `חצי גמר מול ${o1.name}`), h('p', { class: 'muted' }, t.def.desc), h('button', { class: 'btn', onclick: playSemi }, 'לשולחן')] : null,
        t.stage === 'final' ? [h('h3', { style: 'font-family:var(--display);font-size:1.5rem' }, `גמר מול ${t.semi2.name}`), h('p', { class: 'muted' }, `${t.semi2.name} ניצח/ה בחצי הגמר השני.`), h('button', { class: 'btn', onclick: playFinal }, 'לגמר')] : null,
        t.stage === 'done' ? [
          h('h3', { style: 'font-family:var(--display);font-size:1.6rem;color:var(--brass-hi)' }, t.result.place === 1 ? '🏆 זכית בטורניר' : t.result.place === 2 ? 'מקום שני' : 'הודחת בחצי הגמר'),
          h('div', { class: 'receipt num' },
            h('div', {}, h('span', {}, 'קופה (4 × דמי כניסה)'), h('span', {}, shekel(pp.pool))),
            h('div', {}, h('span', {}, `עמלת מערכת ${RAKE}%`), h('span', {}, '−' + shekel(pp.rake))),
            h('div', {}, h('span', {}, 'לחלוקה'), h('span', {}, shekel(pp.net))),
            t.result.place ? h('div', {}, h('span', {}, 'הפרס שלך'), h('span', {}, shekel(t.result.gross))) : null,
            t.result.place ? h('div', {}, h('span', {}, `ניכוי מס ${TAX * 100}% מהרווח`), h('span', {}, '−' + shekel(t.result.tax))) : null,
            h('div', { class: 'tot' }, h('span', {}, 'נכנס לארנק'), h('span', {}, shekel(t.result.place ? t.result.gross - t.result.tax : 0)))),
          h('div', { class: 'acts', style: 'margin-top:10px' }, h('button', { class: 'btn', onclick: () => { st.tour = null; render(); } }, 'לטורנירים'), h('button', { class: 'btn ghost', onclick: () => go('wallet') }, 'לארנק'))] : null)));
}

// =====================================================================
// boot
// =====================================================================
addEventListener('keydown', (e) => { if (e.key === 'Escape') { G.selected = null; if (st.screen === 'table') render(); } });
render();
