<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>דאבל שש</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Frank+Ruhl+Libre:wght@700;900&family=Assistant:wght@400;600;700;800&display=swap">
<style>
/* Concept: a night-time Israeli backgammon tour — from the neighbourhood café to the Rothschild rooftop.
   Landscape-first game shell: top bar · stage. Single deliberate dark world (baize, brass, ivory, ebony). */
:root {
  color-scheme: dark;
  --baize: #0d2a1f; --baize-2: #12382a; --baize-deep: #061610;
  --ink: #f3ead6; --ink-dim: #b9b29e; --ink-faint: #85907f;
  --brass: #e0b04a; --brass-hi: #ffd77a; --brass-lo: #8c6418;
  --ivory: #f7efdc; --ebony: #1b1714; --ruby: #d2493a; --jade: #4fe09a; --sky: #7cc4ff; --violet: #b18cff;
  --panel: rgba(6, 20, 15, .78); --panel-line: rgba(224, 176, 74, .26);
  --display: "Secular One", "Frank Ruhl Libre", "Arial Hebrew", sans-serif;
  --serif: "Frank Ruhl Libre", "David", Georgia, serif;
  --body: "Assistant", "Segoe UI", Arial, sans-serif;
  --bar-h: 58px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; direction: rtl; overflow-x: hidden;
  background: radial-gradient(120% 90% at 50% 0%, var(--baize-2) 0%, var(--baize) 50%, var(--baize-deep) 100%) fixed, var(--baize);
}
body::after { content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .16; z-index: 0;
  background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.03) 0 1px, transparent 1px 3px), repeating-linear-gradient(-45deg, rgba(0,0,0,.2) 0 1px, transparent 1px 4px); }
#app { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column;
  padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); padding-block: 8px 10px; }
.stage { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; }
button { font: inherit; cursor: pointer; border: 0; color: inherit; background: none; }
button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; border-radius: 8px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-dim); } .faint { color: var(--ink-faint); font-size: .82rem; }
.eyebrow { font-size: .7rem; letter-spacing: .14em; color: var(--brass); font-weight: 800; }
.btn { font-family: var(--display); font-size: 1rem; padding: 10px 20px; border-radius: 999px; color: #2a1b02; white-space: nowrap;
  background: linear-gradient(180deg, var(--brass-hi), var(--brass) 55%, var(--brass-lo)); box-shadow: 0 4px 0 #5e420c, 0 10px 22px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.6); transition: transform .08s, box-shadow .08s, filter .2s; }
.btn:hover { filter: brightness(1.07); } .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #5e420c, 0 4px 12px rgba(0,0,0,.4); }
.btn.ghost { background: rgba(255,255,255,.06); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--panel-line); }
.btn.ghost[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--brass-hi); color: var(--brass-hi); }
.btn.red { background: linear-gradient(180deg, #ff8a72, var(--ruby) 60%, #7c1f12); color: #fff; box-shadow: 0 4px 0 #551208, 0 10px 22px rgba(0,0,0,.45); }
.btn.jade { color: #08341f; background: linear-gradient(180deg, #a6ffd0, var(--jade) 55%, #1d7c50); box-shadow: 0 4px 0 #0f4a2f, 0 10px 22px rgba(0,0,0,.45); }
.btn.sm { font-size: .85rem; padding: 7px 13px; } .btn[disabled] { opacity: .4; pointer-events: none; }
input, select { font: inherit; color: var(--ink); background: rgba(0,0,0,.35); border: 1.5px solid var(--panel-line); border-radius: 10px; padding: 9px 11px; width: 100%; }
label.f { display: flex; flex-direction: column; gap: 3px; font-size: .8rem; color: var(--ink-dim); font-weight: 700; min-width: 0; }
.panel { background: var(--panel); border: 1px solid var(--panel-line); border-radius: 16px; padding: 14px; box-shadow: 0 18px 44px rgba(0,0,0,.35); min-width: 0; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; } .row > * { flex: 1; min-width: 110px; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.notice { border-radius: 12px; padding: 10px 12px; background: rgba(124,196,255,.08); border: 1px solid rgba(124,196,255,.35); color: #d7ecff; font-size: .88rem; }
.notice.warn { background: rgba(224,176,74,.1); border-color: var(--panel-line); color: var(--ink); }

/* ---------- top bar ---------- */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; height: var(--bar-h); flex: none; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-size: 1.25rem; white-space: nowrap; }
.brand svg { width: 34px; height: 34px; }
.hudchips { display: flex; gap: 8px; align-items: center; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; min-width: 0; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; background: rgba(0,0,0,.4); border: 1px solid var(--panel-line); font-weight: 800; font-size: .88rem; white-space: nowrap; }
.chip .coin { width: 18px; height: 18px; }
.chip.cash { color: var(--brass-hi); } .chip.lvl { color: var(--sky); } .chip.demo { color: var(--violet); border-color: rgba(177,140,255,.4); }
.xpbar { width: 70px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.12); overflow: hidden; }
.xpbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--sky), #c3e4ff); }

/* ---------- home ---------- */
.home { display: grid; grid-template-columns: minmax(220px, 280px) minmax(0, 1fr); gap: 14px; }
.side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.profile { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; }
.avatar { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-size: 1.4rem; flex: none;
  box-shadow: inset 0 -4px 0 rgba(0,0,0,.25), 0 6px 16px rgba(0,0,0,.4); background: radial-gradient(circle at 35% 30%, #fff, var(--ivory) 45%, #cbbf9f); color: #3a2c12; }
.avatar.bot { background: radial-gradient(circle at 35% 30%, #5a514a, var(--ebony) 60%); color: var(--brass-hi); }
.mission { display: grid; gap: 4px; padding: 8px 0; border-top: 1px solid rgba(255,255,255,.07); }
.mission .top { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; font-size: .9rem; }
.prog { height: 7px; border-radius: 4px; background: rgba(255,255,255,.1); overflow: hidden; }
.prog i { display: block; height: 100%; background: linear-gradient(90deg, var(--brass-lo), var(--brass-hi)); transition: width .6s; }
.prog.done i { background: linear-gradient(90deg, #1d7c50, var(--jade)); }
.main { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.mainhead { display: flex; justify-content: space-between; align-items: end; gap: 10px; flex-wrap: wrap; }
.mainhead h2 { font-family: var(--display); font-size: clamp(1.5rem, 3.4vw, 2.3rem); color: var(--ivory); }
.tabs { display: inline-flex; background: rgba(0,0,0,.35); border-radius: 999px; padding: 4px; border: 1px solid var(--panel-line); }
.tabs button { padding: 6px 14px; border-radius: 999px; font-weight: 800; color: var(--ink-dim); }
.tabs button[aria-pressed="true"] { background: var(--brass); color: #2a1b02; }
.carousel { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(200px, 23%); gap: 14px; overflow-x: auto; padding: 4px 2px 12px; scroll-snap-type: x mandatory; scrollbar-width: thin; }
.arena { scroll-snap-align: start; position: relative; border-radius: 20px; overflow: hidden; min-height: 250px; display: flex; flex-direction: column; justify-content: flex-end; text-align: start;
  border: 1px solid rgba(255,255,255,.12); box-shadow: 0 16px 40px rgba(0,0,0,.45); transition: transform .15s; }
.arena:hover:not(.locked) { transform: translateY(-5px); }
.arena svg.scene { position: absolute; inset: 0; width: 100%; height: 100%; }
.arena .info { position: relative; padding: 12px 14px; background: linear-gradient(180deg, transparent, rgba(0,0,0,.82) 40%); display: grid; gap: 4px; }
.arena h3 { font-family: var(--display); font-size: 1.35rem; color: #fff; text-shadow: 0 2px 8px #000; }
.arena .stake { display: flex; justify-content: space-between; gap: 6px; font-weight: 800; font-size: .88rem; align-items: center; }
.arena .stake .coin { width: 16px; height: 16px; vertical-align: -3px; }
.arena .prize { color: var(--brass-hi); }
.arena .fmt { font-size: .78rem; color: #e0d8c4; }
.arena.locked { filter: grayscale(.85) brightness(.6); }
.arena .lock { position: absolute; top: 10px; inset-inline-start: 10px; background: rgba(0,0,0,.7); border-radius: 999px; padding: 3px 10px; font-size: .78rem; font-weight: 800; }
.arena .badge { position: absolute; top: 10px; inset-inline-end: 10px; background: var(--brass); color: #2a1b02; border-radius: 999px; padding: 2px 10px; font-size: .72rem; font-weight: 800; }
.quick { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.qtile { text-align: start; display: grid; gap: 2px; padding: 12px 14px; border-radius: 14px; background: linear-gradient(160deg, rgba(255,255,255,.07), rgba(0,0,0,.25)); border: 1px solid var(--panel-line); }
.qtile b { font-family: var(--display); font-size: 1.05rem; color: var(--ivory); }
.qtile span { color: var(--ink-dim); font-size: .82rem; }

/* ---------- table ---------- */
.table { display: grid; grid-template-columns: minmax(150px, 210px) minmax(0, 1fr) minmax(150px, 210px); grid-template-rows: minmax(0, 1fr); gap: 12px; height: 100%; min-height: 260px; align-items: stretch; }
.pside { display: flex; flex-direction: column; gap: 10px; min-width: 0; min-height: 0; justify-content: space-between; overflow-y: auto; scrollbar-width: none; }
.pcard { display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: center; padding: 10px; border-radius: 14px; background: var(--panel); border: 1px solid var(--panel-line); position: relative; }
.pcard.turn { box-shadow: 0 0 0 2px var(--brass), 0 0 26px rgba(224,176,74,.35); }
.pcard .nm { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pcard .sub { font-size: .75rem; color: var(--ink-faint); }
.bubble { position: absolute; top: -14px; inset-inline-end: 8px; font-size: 1.6rem; animation: pop 2s forwards; pointer-events: none; }
@keyframes pop { 0% { transform: scale(.2); opacity: 0; } 15% { transform: scale(1.2); opacity: 1; } 80% { opacity: 1; } 100% { transform: translateY(-16px); opacity: 0; } }
.scorebig { text-align: center; font-family: var(--display); }
.scorebig .s { font-size: 2.1rem; color: var(--ivory); line-height: 1; }
.scorebig .m { font-family: var(--body); font-size: .72rem; color: var(--brass); font-weight: 800; letter-spacing: .06em; }
.center { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 0; min-height: 0; gap: 6px; }
.boardwrap { position: relative; width: 100%; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
.boardwrap svg.board { max-width: 100%; max-height: 100%; width: auto; height: 100%; aspect-ratio: 830 / 540; direction: ltr; touch-action: manipulation; user-select: none; filter: drop-shadow(0 20px 30px rgba(0,0,0,.55)); }
.boardlabel { font-family: var(--display); font-size: .95rem; display: flex; gap: 10px; align-items: center; }
.status { font-family: var(--body); font-weight: 800; font-size: .82rem; padding: 3px 11px; border-radius: 999px; background: rgba(0,0,0,.4); }
.status.go { background: var(--brass); color: #2a1b02; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(224,176,74,.18); } }
.dicebox { display: flex; gap: 8px; align-items: center; justify-content: center; min-height: 54px; flex-wrap: wrap; }
.dicebox svg { width: 50px; height: 50px; filter: drop-shadow(0 6px 6px rgba(0,0,0,.45)); }
.dicebox svg.used { opacity: .25; filter: none; }
.dicebox svg.roll { animation: tumble .55s cubic-bezier(.3,1.4,.5,1); }
@keyframes tumble { 0% { transform: translateY(-30px) rotate(-220deg) scale(.6); opacity: 0; } 100% { transform: none; opacity: 1; } }
.minib { border-radius: 12px; padding: 6px; background: var(--panel); border: 1px solid var(--panel-line); text-align: center; display: grid; gap: 4px; }
.minib svg { width: 100%; height: auto; display: block; direction: ltr; pointer-events: none; }
.minib.hot { box-shadow: 0 0 0 2px var(--jade); }
.emotes { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }
.emotes button { font-size: 1.2rem; width: 36px; height: 36px; border-radius: 10px; background: rgba(0,0,0,.35); border: 1px solid var(--panel-line); }
.meta { font-size: .75rem; color: var(--ink-faint); font-variant-numeric: tabular-nums; text-align: center; }
.pt-hit { cursor: pointer; outline: none; }

/* ---------- VS / modals ---------- */
.overlay { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: rgba(2,10,7,.75); padding: 14px; }
.overlay .card { max-width: 520px; width: 100%; max-height: 100%; overflow: auto; text-align: center; display: grid; gap: 10px; padding: 22px; border-radius: 22px;
  background: linear-gradient(180deg, #173b2d, #0b2219); border: 1px solid var(--brass); box-shadow: 0 30px 80px rgba(0,0,0,.6); }
.overlay h2 { font-family: var(--display); font-size: 2.2rem; color: var(--brass-hi); }
.vs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; width: min(640px, 100%); }
.vs .side { align-items: center; text-align: center; animation: slideA .5s cubic-bezier(.2,1.3,.4,1); }
.vs .side.b { animation-name: slideB; }
.vs .avatar { width: 92px; height: 92px; font-size: 2.4rem; }
.vs .x { font-family: var(--display); font-size: 3.4rem; color: var(--brass-hi); text-shadow: 0 0 30px rgba(224,176,74,.7); animation: zoom .6s .2s both; }
@keyframes slideA { from { transform: translateX(120px); opacity: 0; } } @keyframes slideB { from { transform: translateX(-120px); opacity: 0; } }
@keyframes zoom { from { transform: scale(3); opacity: 0; } }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.cal div { border-radius: 10px; padding: 8px 2px; background: rgba(0,0,0,.35); border: 1px solid var(--panel-line); font-size: .75rem; font-weight: 800; }
.cal div b { display: block; font-family: var(--display); font-size: 1rem; color: var(--brass-hi); }
.cal .done { opacity: .45; } .cal .today { background: var(--brass); color: #2a1b02; } .cal .today b { color: #2a1b02; }
.gain { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; font-weight: 800; }
.gain span { padding: 6px 12px; border-radius: 999px; background: rgba(0,0,0,.35); border: 1px solid var(--panel-line); }

/* ---------- lists / grids ---------- */
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.badgec { padding: 10px; border-radius: 14px; background: rgba(0,0,0,.3); border: 1px solid var(--panel-line); display: grid; gap: 2px; text-align: center; }
.badgec .ic { font-size: 1.8rem; } .badgec b { font-size: .9rem; } .badgec span { font-size: .75rem; color: var(--ink-faint); }
.badgec.off { opacity: .35; filter: grayscale(1); }
.skins { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
.skin { border-radius: 12px; overflow: hidden; border: 2px solid transparent; background: rgba(0,0,0,.3); text-align: center; padding-bottom: 6px; font-size: .8rem; font-weight: 800; display: grid; gap: 6px; }
.skin[aria-pressed="true"] { border-color: var(--brass-hi); }
.skin.off { opacity: .4; }
.skin .sw { height: 54px; display: grid; grid-template-columns: repeat(4, 1fr); }
.hist { width: 100%; border-collapse: collapse; font-size: .85rem; font-variant-numeric: tabular-nums; }
.hist td { padding: 6px 4px; border-bottom: 1px solid rgba(255,255,255,.07); }
.hist td:last-child { text-align: left; font-weight: 800; }
.plus { color: var(--jade); } .minus { color: #ff9b8a; }
.balance { font-family: var(--display); font-size: clamp(2rem, 5vw, 2.8rem); color: var(--brass-hi); line-height: 1; }
.codebox { font-family: ui-monospace, Menlo, monospace; font-size: 1.3rem; letter-spacing: .12em; padding: 10px; border-radius: 10px; background: rgba(0,0,0,.45); border: 1.5px dashed var(--brass); text-align: center; user-select: all; direction: ltr; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: .88rem; } .kv dt { color: var(--ink-faint); } .kv dd { margin: 0; font-weight: 700; }
.slide { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 20px; align-items: center; }
.slide h2 { font-family: var(--serif); font-weight: 900; font-size: clamp(1.5rem, 3.2vw, 2.3rem); line-height: 1.1; color: var(--ivory); }
.slide p { margin: 8px 0 0; color: var(--ink-dim); max-width: 60ch; }
.big { font-family: var(--display); font-size: clamp(2.6rem, 6vw, 4.4rem); color: var(--brass-hi); line-height: 1; }
.law { font-family: var(--serif); color: var(--ivory); border-inline-start: 3px solid var(--brass); padding: 6px 12px; background: rgba(0,0,0,.25); border-radius: 0 10px 10px 0; }
.bars { display: grid; gap: 10px; }
.bar .lbl { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; font-size: .88rem; }
.bar .track { height: 16px; border-radius: 8px; background: rgba(0,0,0,.4); overflow: hidden; position: relative; }
.bar .fill { position: absolute; inset: 0 0 0 auto; width: 0; border-radius: 8px; background: linear-gradient(90deg, var(--brass-lo), var(--brass-hi)); transition: width 1.1s cubic-bezier(.2,.8,.2,1); }
.bar .fill.weak { background: linear-gradient(90deg, #7c1f12, var(--ruby)); } .bar .fill.tie { background: linear-gradient(90deg, #1f7a52, var(--jade)); }
.conds { display: grid; gap: 8px; }
.cond { display: grid; grid-template-columns: auto 1fr; gap: 10px; padding: 10px; border-radius: 12px; background: rgba(0,0,0,.28); border: 1px solid var(--panel-line); }
.cond .k { font-family: var(--display); font-size: 1.4rem; color: var(--brass); width: 30px; text-align: center; }
.counter { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; text-align: center; }
.counter div { background: rgba(0,0,0,.3); border-radius: 12px; padding: 8px 4px; border: 1px solid var(--panel-line); font-size: .8rem; }
.counter b { display: block; font-family: var(--display); font-size: 1.8rem; color: var(--ivory); }
.dots { display: flex; flex-wrap: wrap; gap: 4px; min-height: 14px; } .dots i { width: 11px; height: 11px; border-radius: 50%; }
.dots i.t { background: var(--jade); } .dots i.w { background: var(--brass); } .dots i.l { background: var(--ruby); }
.steps { display: flex; gap: 6px; justify-content: center; } .steps button { width: 30px; height: 7px; border-radius: 4px; background: rgba(255,255,255,.15); }
.steps button[aria-current="step"] { background: var(--brass); }

/* ---------- rotate prompt & responsive ---------- */
#rotate { position: fixed; inset: 0; z-index: 90; display: none; place-items: center; text-align: center; padding: 24px; background: var(--baize-deep); }
#rotate .ph { width: 70px; height: 110px; border: 4px solid var(--brass); border-radius: 14px; margin: 0 auto 18px; animation: rot 2.2s ease-in-out infinite; }
@keyframes rot { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
@media (orientation: portrait) and (max-width: 760px) { body.on-table:not(.portrait-ok) #rotate { display: grid; } }
@media (max-width: 900px) { .home { grid-template-columns: minmax(190px, 230px) minmax(0, 1fr); } .carousel { grid-auto-columns: minmax(180px, 42%); } }
@media (max-height: 480px) {
  :root { --bar-h: 44px; } body { font-size: 14px; } .arena { min-height: 190px; } .brand span { display: none; }
  .table { grid-template-columns: minmax(118px, 160px) minmax(0, 1fr) minmax(118px, 160px); gap: 8px; }
  .dicebox svg { width: 38px; height: 38px; } .dicebox { min-height: 40px; } .avatar { width: 36px; height: 36px; font-size: 1rem; }
  .pcard { padding: 6px; } .scorebig .s { font-size: 1.6rem; } .emotes button { width: 30px; height: 30px; font-size: 1rem; }
  .btn { padding: 8px 14px; font-size: .9rem; } .mission { padding: 5px 0; }
  .pside { gap: 6px; } .pside .meta, .boardlabel > span:first-child { display: none; } .pcard .sub { display: none; } .scorebig .m { font-size: .65rem; }
}
@media (orientation: portrait) { .home, .table { grid-template-columns: 1fr; } .table { height: auto; grid-template-rows: none; } .boardwrap svg.board { width: 100%; height: auto; } }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 60; }

<script>
// ---- engine/board.js ----
// Backgammon rules engine. Pure JS (ESM) — runs in Node and in the browser.
//
// Absolute board: points[0..23]. Positive = white checkers, negative = black.
// White moves from 23 -> 0 and bears off below 0; white home = 0..5.
// Black moves from 0 -> 23 and bears off above 23; black home = 18..23.
//
// Moves are expressed in the mover's OWN perspective:
//   own index 0..23 (0 = deepest home point), BAR = 24, OFF = -1.

const BAR = 24;
const OFF = -1;
const COLORS = ['w', 'b'];

const other = (c) => (c === 'w' ? 'b' : 'w');
const sign = (c) => (c === 'w' ? 1 : -1);
const toAbs = (c, i) => (c === 'w' ? i : 23 - i);
const toOwn = (c, a) => (c === 'w' ? a : 23 - a);

function initialState() {
  const points = new Array(24).fill(0);
  points[23] = 2; points[12] = 5; points[7] = 3; points[5] = 5;
  points[0] = -2; points[11] = -5; points[16] = -3; points[18] = -5;
  return { points, bar: { w: 0, b: 0 }, off: { w: 0, b: 0 } };
}

function cloneState(s) {
  return { points: s.points.slice(), bar: { ...s.bar }, off: { ...s.off } };
}

function stateKey(s) {
  return s.points.join(',') + '|' + s.bar.w + ',' + s.bar.b + '|' + s.off.w + ',' + s.off.b;
}

/** Number of `c`'s checkers on own index i. */
function ownCount(s, c, i) {
  const v = s.points[toAbs(c, i)] * sign(c);
  return v > 0 ? v : 0;
}

/** Number of opponent checkers on `c`'s own index i. */
function oppCount(s, c, i) {
  const v = -s.points[toAbs(c, i)] * sign(c);
  return v > 0 ? v : 0;
}

function allHome(s, c) {
  if (s.bar[c] > 0) return false;
  for (let i = 6; i < 24; i++) if (ownCount(s, c, i) > 0) return false;
  return true;
}

/** Returns destination own-index (or OFF) if checker at `from` can move `die`, else null. */
function singleTarget(s, c, from, die) {
  if (s.bar[c] > 0 && from !== BAR) return null;
  if (from === BAR) {
    if (s.bar[c] === 0) return null;
    const to = BAR - die;
    return oppCount(s, c, to) < 2 ? to : null;
  }
  if (from < 0 || from > 23 || ownCount(s, c, from) === 0) return null;
  const to = from - die;
  if (to >= 0) return oppCount(s, c, to) < 2 ? to : null;
  if (!allHome(s, c)) return null;
  if (to === -1) return OFF;
  for (let i = from + 1; i < 6; i++) if (ownCount(s, c, i) > 0) return null;
  return OFF;
}

/** Applies a single checker move (own perspective). Returns a new state. */
function applyMove(s, c, m) {
  const n = cloneState(s);
  const sg = sign(c);
  if (m.from === BAR) n.bar[c]--;
  else n.points[toAbs(c, m.from)] -= sg;
  if (m.to === OFF) {
    n.off[c]++;
  } else {
    const a = toAbs(c, m.to);
    if (n.points[a] === -sg) { // hit a blot
      n.points[a] = 0;
      n.bar[other(c)]++;
    }
    n.points[a] += sg;
  }
  return n;
}

function applySequence(s, c, seq) {
  let n = s;
  for (const m of seq) n = applyMove(n, c, m);
  return n;
}

function sources(s, c) {
  if (s.bar[c] > 0) return [BAR];
  const out = [];
  for (let i = 23; i >= 0; i--) if (ownCount(s, c, i) > 0) out.push(i);
  return out;
}

/**
 * All legal full-turn move sequences for dice [d1, d2].
 * Enforces: play as many dice as possible; if only one die can be played,
 * the larger must be played when possible. Sequences leading to identical
 * positions are de-duplicated. Returns [{ moves, state }]. If nothing is
 * playable, returns [{ moves: [], state }].
 */
function legalSequences(s, c, dice) {
  const [d1, d2] = dice;
  const orders = d1 === d2 ? [[d1, d1, d1, d1]] : [[d1, d2], [d2, d1]];
  const results = [];
  let maxLen = 0;

  const rec = (st, rest, moves) => {
    let moved = false;
    if (rest.length > 0) {
      const die = rest[0];
      for (const from of sources(st, c)) {
        const to = singleTarget(st, c, from, die);
        if (to === null) continue;
        moved = true;
        const m = { from, to, die };
        rec(applyMove(st, c, m), rest.slice(1), moves.concat([m]));
      }
    }
    if (!moved) {
      if (moves.length > maxLen) maxLen = moves.length;
      results.push({ moves, state: st });
    }
  };
  for (const order of orders) rec(s, order, []);

  let filtered = results.filter((r) => r.moves.length === maxLen);
  if (maxLen === 1 && d1 !== d2) {
    const hi = Math.max(d1, d2);
    if (filtered.some((r) => r.moves[0].die === hi)) {
      filtered = filtered.filter((r) => r.moves[0].die === hi);
    }
  }
  const seen = new Set();
  const out = [];
  for (const r of filtered) {
    const k = stateKey(r.state);
    if (seen.has(k)) continue;
    seen.add(k);
    out.push(r);
  }
  return out.length ? out : [{ moves: [], state: s }];
}

function pipCount(s, c) {
  let p = s.bar[c] * 25;
  for (let i = 0; i < 24; i++) p += ownCount(s, c, i) * (i + 1);
  return p;
}

function checkerTotal(s, c) {
  let n = s.bar[c] + s.off[c];
  for (let i = 0; i < 24; i++) n += ownCount(s, c, i);
  return n;
}

/** If `winner` has borne off all checkers: 1 single, 2 gammon, 3 backgammon. */
function winMultiplier(s, winner) {
  const loser = other(winner);
  if (s.off[loser] > 0) return 1;
  if (s.bar[loser] > 0) return 3;
  // Loser checkers inside the winner's home board (loser own idx 18..23).
  for (let i = 18; i < 24; i++) if (ownCount(s, loser, i) > 0) return 3;
  return 2;
}

function sameMoves(a, b) {
  if (a.length !== b.length) return false;
  for (let i = 0; i < a.length; i++) {
    if (a[i].from !== b[i].from || a[i].to !== b[i].to) return false;
  }
  return true;
}

/** Finds the legal sequence matching submitted moves (by from/to), or the same resulting position. */
function matchSequence(legal, s, c, moves) {
  const exact = legal.find((l) => sameMoves(l.moves, moves));
  if (exact) return exact;
  // Accept any ordering of the same checker moves that yields a legal end position.
  try {
    let st = s;
    for (const m of moves) {
      if (typeof m.from !== 'number' || typeof m.to !== 'number') return null;
      st = applyMove(st, c, m);
    }
    const k = stateKey(st);
    if (moves.length !== (legal[0]?.moves.length ?? 0)) return null;
    return legal.find((l) => stateKey(l.state) === k) || null;
  } catch {
    return null;
  }
}

// ---- engine/game.js ----
// Game & match flow (pure, deterministic given a dice function).

const MAX_CUBE = 64;

/**
 * One game of backgammon.
 * diceFn(rollIndex) -> [d1, d2]  (deterministic stream; see server/dice.js)
 * Phases: 'roll' -> 'move' -> ... ; 'doubled' while a cube offer is pending; 'over'.
 */
class Game {
  constructor({ diceFn, cubeEnabled = true, crawford = false }) {
    this.diceFn = diceFn;
    this.cubeEnabled = cubeEnabled && !crawford;
    this.crawford = crawford;
    this.state = initialState();
    this.cube = { value: 1, owner: null };
    this.rollIndex = 0;
    this.turn = null;
    this.dice = null;
    this.phase = 'init';
    this.legal = null;
    this.result = null; // { winner, multiplier, points, reason }
    this.log = [];
    this.plies = 0;
    this._opening();
  }

  _nextRoll() {
    const r = this.diceFn(this.rollIndex);
    this.rollIndex++;
    return r;
  }

  _opening() {
    let d;
    do { d = this._nextRoll(); } while (d[0] === d[1]);
    this.turn = d[0] > d[1] ? 'w' : 'b';
    this._startMove(d);
    this.log.push({ t: 'opening', dice: d, turn: this.turn });
  }

  _startMove(dice) {
    this.dice = dice;
    this.legal = legalSequences(this.state, this.turn, dice);
    this.phase = 'move';
    if (this.legal.length === 1 && this.legal[0].moves.length === 0) {
      this.log.push({ t: 'pass', color: this.turn, dice });
      this._endTurn();
    }
  }

  _endTurn() {
    this.plies++;
    this.turn = other(this.turn);
    this.dice = null;
    this.legal = null;
    this.phase = 'roll';
  }

  canDouble(color) {
    return this.phase === 'roll' && this.turn === color && this.cubeEnabled
      && this.cube.value < MAX_CUBE && (this.cube.owner === null || this.cube.owner === color);
  }

  /** True when the player on roll has no cube decision (so the server may auto-roll). */
  rollIsForced() {
    return this.phase === 'roll' && !this.canDouble(this.turn);
  }

  roll(color) {
    if (this.phase !== 'roll' || this.turn !== color) throw new Error('not your roll');
    const d = this._nextRoll();
    this.log.push({ t: 'roll', color, dice: d });
    this._startMove(d);
    return d;
  }

  move(color, moves) {
    if (this.phase !== 'move' || this.turn !== color) throw new Error('not your move');
    const seq = matchSequence(this.legal, this.state, color, moves);
    if (!seq) throw new Error('illegal move');
    this.state = seq.state;
    this.log.push({ t: 'move', color, dice: this.dice, moves: seq.moves });
    if (this.state.off[color] === 15) {
      const mult = winMultiplier(this.state, color);
      this._finish(color, mult, mult === 1 ? 'single' : mult === 2 ? 'gammon' : 'backgammon');
    } else {
      this._endTurn();
    }
    return seq;
  }

  double(color) {
    if (!this.canDouble(color)) throw new Error('cannot double');
    this.phase = 'doubled';
    this.log.push({ t: 'double', color, value: this.cube.value * 2 });
  }

  take(color) {
    if (this.phase !== 'doubled' || this.turn === color) throw new Error('no double to take');
    this.cube = { value: this.cube.value * 2, owner: color };
    this.phase = 'roll';
    this.log.push({ t: 'take', color });
  }

  drop(color) {
    if (this.phase !== 'doubled' || this.turn === color) throw new Error('no double to drop');
    this.log.push({ t: 'drop', color });
    this._finish(other(color), 1, 'drop');
  }

  resign(color) {
    if (this.phase === 'over') throw new Error('game over');
    // Resigning concedes what the opponent would win if the game ended now
    // (gammon if the resigner has borne off nothing) — prevents gammon-dodging.
    const winner = other(color);
    const mult = this.state.off[color] > 0 ? 1 : 2;
    this.log.push({ t: 'resign', color });
    this._finish(winner, mult, 'resign');
  }

  _finish(winner, multiplier, reason) {
    this.phase = 'over';
    this.dice = null;
    this.legal = null;
    this.result = { winner, multiplier, points: multiplier * this.cube.value, reason };
  }

  pips() {
    return { w: pipCount(this.state, 'w'), b: pipCount(this.state, 'b') };
  }

  snapshot() {
    return {
      state: this.state,
      cube: this.cube,
      cubeEnabled: this.cubeEnabled,
      crawford: this.crawford,
      turn: this.turn,
      dice: this.dice,
      phase: this.phase,
      result: this.result,
      pips: this.pips(),
      rollIndex: this.rollIndex,
    };
  }
}

/**
 * Classic match to `target` points between seats A and B.
 * Seat A plays white in odd games, black in even games (colors alternate).
 * gameDiceFn(gameIndex) -> diceFn
 */
class ClassicMatch {
  constructor({ target = 5, cube = true, gameDiceFn }) {
    this.kind = 'classic';
    this.target = target;
    this.cube = cube;
    this.gameDiceFn = gameDiceFn;
    this.score = { A: 0, B: 0 };
    this.crawfordUsed = false;
    this.games = [];
    this.over = false;
    this.winner = null;
    this._newGame();
  }

  colorOf(seat, gi = this.games.length - 1) {
    const aWhite = gi % 2 === 0;
    return (seat === 'A') === aWhite ? 'w' : 'b';
  }

  seatOf(color, gi = this.games.length - 1) {
    return this.colorOf('A', gi) === color ? 'A' : 'B';
  }

  _newGame() {
    const gi = this.games.length;
    let crawford = false;
    if (this.target > 1 && !this.crawfordUsed
      && (this.score.A === this.target - 1 || this.score.B === this.target - 1)) {
      crawford = true;
      this.crawfordUsed = true;
    }
    const g = new Game({ diceFn: this.gameDiceFn(gi), cubeEnabled: this.cube && this.target > 1, crawford });
    this.games.push(g);
    return g;
  }

  /** Boards in play (always one for classic). */
  boards() { return [this.current()]; }
  current() { return this.games[this.games.length - 1]; }

  /** Call after any action; rolls over to next game when one ends. Returns true if a game just ended. */
  settle() {
    const g = this.current();
    if (g.phase !== 'over' || this.over) return false;
    const seat = this.seatOf(g.result.winner);
    this.score[seat] += g.result.points;
    if (this.score[seat] >= this.target) {
      this.over = true;
      this.winner = seat;
    } else {
      this._newGame();
    }
    return true;
  }
}

/**
 * Duplicate match: `pairs` rounds; in each round two boards are played at the
 * same time with the SAME dice stream. Board 1: A = white. Board 2: A = black.
 * Because both boards consume the identical roll sequence by roll index, each
 * player faces exactly the dice their opponent faced on the other board, so
 * luck cancels out. Total points over all boards decide the match.
 * Ties go to sudden-death extra rounds (up to maxExtra), then to the skill
 * tiebreak supplied by the caller (lower average engine-measured error).
 */
class DuplicateMatch {
  constructor({ pairs = 1, cube = false, gameDiceFn, maxExtra = 2 }) {
    this.kind = 'duplicate';
    this.pairs = pairs;
    this.cube = cube;
    this.gameDiceFn = gameDiceFn;
    this.maxExtra = maxExtra;
    this.score = { A: 0, B: 0 };
    this.rounds = [];
    this.over = false;
    this.winner = null; // 'A' | 'B' | 'draw'
    this.tiebreak = null;
    this._newRound();
  }

  colorOf(seat, board) {
    return (seat === 'A') === (board === 0) ? 'w' : 'b';
  }

  seatOf(color, board) {
    return this.colorOf('A', board) === color ? 'A' : 'B';
  }

  _newRound() {
    const ri = this.rounds.length;
    const diceFn = this.gameDiceFn(ri);
    this.rounds.push([
      new Game({ diceFn, cubeEnabled: this.cube }),
      new Game({ diceFn, cubeEnabled: this.cube }),
    ]);
  }

  boards() { return this.rounds[this.rounds.length - 1]; }

  settle() {
    const round = this.boards();
    if (this.over || round.some((g) => g.phase !== 'over')) return false;
    if (round._settled) return false;
    round._settled = true;
    round.forEach((g, b) => {
      this.score[this.seatOf(g.result.winner, b)] += g.result.points;
    });
    const played = this.rounds.length;
    if (played >= this.pairs) {
      if (this.score.A !== this.score.B) {
        this.over = true;
        this.winner = this.score.A > this.score.B ? 'A' : 'B';
      } else if (played >= this.pairs + this.maxExtra) {
        this.over = true;
        this.winner = 'draw';
      } else {
        this._newRound();
      }
    } else {
      this._newRound();
    }
    return true;
  }
}

// ---- engine/bot.js ----
// Heuristic backgammon AI with adjustable strength (pure JS).
// Strength is controlled by evaluation noise: the same evaluator is used at
// every level, weaker levels add random error to each candidate's score.
// The noiseless evaluator also powers the anti-cheat / move-quality metric.

const LEVELS = {
  expert: { noise: 0, label: 'מומחה' },
  strong: { noise: 3, label: 'חזק' },
  intermediate: { noise: 8, label: 'בינוני' },
  beginner: { noise: 20, label: 'מתחיל' },
  random: { noise: Infinity, label: 'אקראי' },
};

const ROLLS = [];
for (let a = 1; a <= 6; a++) for (let b = a; b <= 6; b++) ROLLS.push([a, b, a === b ? 1 : 2]);

/** Is own point i blocked for `c` (opponent has 2+)? */
const blocked = (s, c, i) => i >= 0 && i <= 23 && oppCount(s, c, i) >= 2;

/**
 * Probability (0..1) that opponent hits c's blot at own index i next roll.
 * Approximation: considers direct and combination shots, intermediate landing
 * points, ignores bar-entry restrictions for the hitter.
 */
function shotProbability(s, c, i) {
  const o = other(c);
  // Opponent checkers positions in opponent's own perspective; blot position in o's perspective:
  const target = 23 - i;
  const hitters = [];
  if (s.bar[o] > 0) hitters.push(24);
  for (let j = target + 1; j < 24; j++) if (ownCount(s, o, j) > 0) hitters.push(j);
  if (!hitters.length) return 0;
  // Blocked check for the hitter (o) at its own index k means c has 2+ there.
  const blk = (k) => k >= 0 && k <= 23 && ownCount(s, c, 23 - k) >= 2;
  let hits = 0;
  for (const [a, b, w] of ROLLS) {
    let hit = false;
    for (const h of hitters) {
      const d = h - target;
      if (a !== b) {
        if (d === a || d === b) { hit = true; break; }
        if (d === a + b && (!blk(h - a) || !blk(h - b))) { hit = true; break; }
      } else {
        for (let k = 1; k <= 4; k++) {
          if (blk(h - a * k) && k * a < d) break;
          if (d === a * k) { hit = true; break; }
        }
        if (hit) break;
      }
    }
    if (hit) hits += w;
  }
  return hits / 36;
}

function hasContact(s, c) {
  // c's rearmost checker (own idx) vs opponent's rearmost checker expressed in c's own coords.
  let myBack = -1;
  if (s.bar[c] > 0) myBack = 24;
  else for (let i = 23; i >= 0; i--) if (ownCount(s, c, i) > 0) { myBack = i; break; }
  const o = other(c);
  if (s.bar[o] > 0) return true;
  let oppBackInMine = 24;
  for (let i = 0; i < 24; i++) if (oppCount(s, c, i) > 0) { oppBackInMine = i; break; }
  return myBack > oppBackInMine;
}

/** Static evaluation of position `s` from the perspective of `c` who just moved. Higher = better. */
function evaluate(s, c) {
  const o = other(c);
  if (s.off[c] === 15) return 1000;
  const myPip = pipCount(s, c);
  const opPip = pipCount(s, o);

  if (!hasContact(s, c)) {
    // Pure race: pips dominate; small penalty for checkers far from home & gaps.
    let waste = 0;
    for (let i = 6; i < 24; i++) waste += ownCount(s, c, i) * 0.5;
    return (opPip - myPip) * 1.2 + s.off[c] * 1.5 - waste;
  }

  let score = (opPip - myPip) * 0.6;
  // Made points & primes.
  let run = 0; let best = 0; let homeMade = 0;
  for (let i = 0; i < 24; i++) {
    const n = ownCount(s, c, i);
    if (n >= 2) {
      run++; best = Math.max(best, run);
      if (i <= 5) { homeMade++; score += 3; }
      if (i === 6) score += 3;
      if (i === 3 || i === 4) score += 2.5;
      if (i >= 18) score += 2.5; // anchor in opponent's home board
      if (i > 6 && i < 18) score += 1.2;
      if (n > 3) score -= (n - 3) * 0.5; // stacking
    } else {
      run = 0;
    }
  }
  score += best * best * 1.3;

  // Blot exposure.
  for (let i = 0; i < 24; i++) {
    if (ownCount(s, c, i) === 1) {
      const p = shotProbability(s, c, i);
      score -= p * ((24 - i) * 0.55 + 5 + homeMadeOpp(s, o) * 1.5);
    }
  }

  // Opponent checkers on the bar are worth more against a strong home board.
  score += s.bar[o] * (6 + homeMade * 2.5);
  score -= s.bar[c] * 6;
  score += s.off[c] * 1.5;
  return score;
}

function homeMadeOpp(s, o) {
  let n = 0;
  for (let i = 0; i <= 5; i++) if (ownCount(s, o, i) >= 2) n++;
  return n;
}

function gauss(rng) {
  const u = 1 - rng(); const v = rng();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

/** Scores every legal sequence with the noiseless evaluator. */
function scoreSequences(legal, c) {
  return legal.map((l) => evaluate(l.state, c));
}

/** Choose a sequence index for `level`. rng: () => [0,1). */
function chooseSequence(legal, c, level = 'expert', rng = Math.random) {
  if (legal.length === 1) return 0;
  const noise = (LEVELS[level] ?? LEVELS.expert).noise;
  if (noise === Infinity) return Math.floor(rng() * legal.length);
  let bestI = 0; let bestV = -Infinity;
  for (let i = 0; i < legal.length; i++) {
    const v = evaluate(legal[i].state, c) + (noise ? gauss(rng) * noise : 0);
    if (v > bestV) { bestV = v; bestI = i; }
  }
  return bestI;
}

/** Rough "position strength" for cube decisions, from c's perspective (c on roll). */
function cubeView(s, c) {
  const myPip = pipCount(s, c);
  const opPip = pipCount(s, other(c));
  if (!hasContact(s, c) && !hasContact(s, other(c))) {
    return { race: true, lead: (opPip - myPip) / Math.max(myPip, 1) };
  }
  return { race: false, score: evaluate(s, c) - evaluate(s, other(c)) };
}

function shouldDouble(s, c, level = 'expert') {
  if (level === 'random') return false;
  const v = cubeView(s, c);
  return v.race ? v.lead > 0.09 && v.lead < 0.25 : v.score > 30 && v.score < 70;
}

function shouldTake(s, c, level = 'expert') {
  if (level === 'random') return Math.random() < 0.5;
  // c is the one being doubled, opponent is on roll.
  const v = cubeView(s, other(c));
  return v.race ? v.lead < 0.2 : v.score < 60;
}

/** Equity-like loss of a chosen sequence vs the best (noiseless). Used for move-quality stats. */
function moveError(legal, c, chosenIndex) {
  if (legal.length <= 1) return { error: 0, rank: 0, forced: true };
  const scores = scoreSequences(legal, c);
  const best = Math.max(...scores);
  const chosen = scores[chosenIndex];
  const rank = scores.filter((x) => x > chosen).length;
  return { error: best - chosen, rank, forced: false };
}

          mine && g.phase === 'doubled' ? [h('b', { class: 'T-q' }, `היריב מכפיל ל-${g.cube.value * 2}`), h('button', { class: 'btn', onclick: act(() => g.take(me)) }, 'קבל'), h('button', { class: 'btn red', onclick: act(() => g.drop(me)) }, 'ותר')] : null,
          p && p.moves.length ? h('button', { class: 'btn ghost sm', onclick: () => { G.partial.delete(b); G.selected = null; render(); } }, 'בטל מהלך') : null) : null),
      h('div', { class: 'T-right' },
        h('button', { class: 'T-rb', 'aria-label': 'תגובות', onclick: () => { G.showEmotes = !G.showEmotes; render(); } }, ICON('chat-bubble')),
        emoteBar,
        h('button', { class: 'T-rb', 'aria-label': audio.on ? 'השתק' : 'הפעל צלילים', onclick: () => { audio.on = !audio.on; store.set('sound', audio.on); render(); } }, audio.on ? '🔊' : '🔈'),
        h('button', { class: 'T-rb red', 'aria-label': 'יציאה', onclick: () => (G.M.over ? go('home') : confirmLeave()) }, ICON('exit-door')))));
}

// ---------- results ----------
function resultScreen({ won, draw, xp, delta, prizeLine, again, close, cash }) {
  const M = G.M;
  const lv = level(P.xp); const pct = Math.round(Math.min(100, ((P.xp - xpFor(lv)) / (xpFor(lv + 1) - xpFor(lv))) * 100));
  return h('div', { class: 'V res', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'res-t' },
    h('div', { class: 'V-half blue' }), h('div', { class: 'V-half red' }),
    h('div', { class: 'R-top' },
      h('div', { class: 'R-p' + (won ? ' win' : '') }, ringAvatar('blue', CL.nick, lv, { coins: P.coins }), h('b', {}, CL.nick)),
      h('div', { class: 'R-mid' }, h('h2', { id: 'res-t' }, draw ? 'תיקו!' : won ? 'ניצחת!' : 'הפסד'), h('div', { class: 'R-score num' }, `${M.score.A}:${M.score.B}`),
        h('div', { class: 'R-xp' }, ICON('star-medal', 'R-star'), h('b', { class: 'num' }, `+${xp} XP`), h('span', { class: 'R-xpbar' }, h('i', { style: `width:${pct}%` })), h('small', { class: 'num' }, `רמה ${lv} · ${pct}%`))),
      h('div', { class: 'R-p' + (!won && !draw ? ' win' : '') }, ringAvatar('red', G.cfg.oppName, { beginner: 1, intermediate: 3, strong: 6, expert: 10 }[G.cfg.level] || 2), h('b', {}, G.cfg.oppName))),
    h('div', { class: 'R-gain num' }, prizeLine ? h('span', { class: 'gold' }, prizeLine) : null, h('span', {}, `דירוג ${delta >= 0 ? '+' : ''}${delta}`), P.run >= 2 ? h('span', {}, `🔥 ${P.run} ברצף`) : null),
    h('p', { class: 'R-why' }, draw ? 'שיחקתם באותה רמה בדיוק, עם אותן קוביות.' : M.kind === 'duplicate' ? 'אותן קוביות בדיוק לשניכם. ההבדל היה במהלכים.' : won ? 'משחק חזק.' : 'שווה לנסות שוב.'),
    cash && !won ? h('p', { class: 'R-why' }, 'לא מומלץ לנסות "להחזיר" הפסד בכסף. אפשר להגדיר מגבלות.') : null,
    h('div', { class: 'R-acts' }, cash ? h('button', { class: 'btn', onclick: close }, 'ללובי') : [h('button', { class: 'btn jade big', onclick: again }, 'המשחק הבא'), h('button', { class: 'btn ghost', onclick: close }, 'ללובי')]));
}

// =====================================================================
// ONLINE MODE — when served by the game server, the lobby and matches run against it.
// Offline (e.g. a single-file preview), everything stays local with bots.
// =====================================================================
let ONLINE = false;
const NET = { ws: null, me: null, clubs: [], tours: [], queued: false, ratingAtStart: null };
const TOKEN_KEY = 'token';
const netSend = (m) => { try { NET.ws?.readyState === 1 && NET.ws.send(JSON.stringify(m)); } catch { /* closed */ } };
const seedHex = () => Array.from(crypto.getRandomValues(new Uint8Array(12)), (b) => b.toString(16).padStart(2, '0')).join('');

function netConnect() {
  if (!/^https?:$/.test(location.protocol)) return;
  let ws;
  try { ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`); } catch { return; }
  const giveUp = setTimeout(() => { if (!ONLINE) try { ws.close(); } catch { /* */ } }, 3000);
  ws.onopen = () => {
    clearTimeout(giveUp); ONLINE = true; NET.ws = ws;
    const token = store.get(TOKEN_KEY, null);
    if (token) netSend({ t: 'auth', token }); else showRegister();
  };
  ws.onmessage = (ev) => { try { onNet(JSON.parse(ev.data)); } catch (e) { console.error(e); } };
  ws.onclose = () => { if (ONLINE) { toast('החיבור לשרת נותק – מתחבר מחדש…'); NET.ws = null; setTimeout(netConnect, 2500); } };
}

function showRegister() {
  if ($('#reg')) return;
  document.body.append(h('div', { class: 'overlay', id: 'reg', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'reg-t' },
    h('form', { class: 'card', onsubmit: (e) => { e.preventDefault(); const f = e.target.elements; netSend({ t: 'register', name: f.nick.value, birthDate: f.bd.value, acceptTerms: f.terms.checked ? '2026-11-beta-1' : null }); } },
      h('h2', { id: 'reg-t' }, 'ברוך הבא ל' + BRAND),
      h('label', { class: 'f', for: 'nick' }, 'כינוי', h('input', { id: 'nick', name: 'nick', required: true, minlength: 2, maxlength: 20, value: CL.nick.replace(/\s/g, '') })),
      h('label', { class: 'f', for: 'bd' }, 'תאריך לידה (18+)', h('input', { id: 'bd', name: 'bd', type: 'date', required: true })),
      h('label', { class: 'acts faint', style: 'justify-content:center' }, h('input', { type: 'checkbox', name: 'terms', required: true, style: 'width:auto' }), 'קראתי ואני מסכים ל', h('a', { href: '/doc.html?f=terms.md', target: '_blank', style: 'color:var(--brass-hi)' }, 'תקנון')),
      h('button', { class: 'btn' }, 'כניסה'),
      h('p', { class: 'faint' }, 'משחקים על נקודות ללא ערך כספי. נשמרת רק שנת הלידה.'))));
}

const STATUS_MAP = { registering: 'open', running: 'running', done: 'done', aborted: 'done' };
function mapTour(t) {
  const r = t.rules || {};
  return {
    id: t.id, name: t.name, clubId: t.clubId, stage: t.stage || 'club', mode: t.mode, len: t.length, size: t.size,
    entry: r.entryTicket ? { ticket: r.entryTicket } : { coins: r.entryFee || 0 },
    prize: r.prizeTicket ? { ticket: r.prizeTicket, n: 1 } : { coins: true },
    hostFee: r.hostFeePct || 0, host: t.hostName, players: t.players || [], status: STATUS_MAP[t.status] || 'open',
    startAt: Date.now() - 1, result: t.results ? { text: `המנצח: ${t.results.ranking[0]}`, sub: t.results.prizeTicket ? 'קיבל כרטיס לשלב הבא' : `פרסים: ${(t.results.prizes || []).map((p) => fmt(p.amount)).join(' / ')}` } : null,
    online: true,
  };
}
function syncMe(u) {
  NET.me = u; P.coins = u.balance; P.tickets = { ...(u.tickets || { s2: 0, final: 0, live: 0 }) };
  P.rating = u.rating; P.xp = Math.max(P.xp, u.xp || 0); CL.nick = u.name;
}
function refreshLobby() { netSend({ t: 'me' }); netSend({ t: 'clubs' }); netSend({ t: 'tournaments' }); }

function onNet(m) {
  switch (m.t) {
    case 'welcome':
      if (m.token) store.set(TOKEN_KEY, m.token);
      $('#reg')?.remove(); syncMe(m.user); refreshLobby();
      if (m.gift) toast(`+${m.gift.amount} מטבעות · מתנה יומית (רצף ${m.gift.streak})`);
      if (st.screen !== 'table') render();
      break;
    case 'me': syncMe(m.user); if (st.screen !== 'table') render(); break;
    case 'error':
      if (m.msg === 'התחברות נכשלה') { store.set(TOKEN_KEY, null); showRegister(); }
      toast(m.msg); break;
    case 'clubs': CL.clubs = m.list.map((c) => ({ id: c.id, name: c.name, logo: c.logo, members: Array(c.members).fill(''), owner: c.owner ? CL.nick : '' })); if (!['table', 'guide'].includes(st.screen)) render(); break;
    case 'club': {
      const c = m.club; const i = CL.clubs.findIndex((x) => x.id === c.id);
      const loc = { id: c.id, name: c.name, logo: c.logo, members: c.members, owner: c.ownerName, code: c.code, isOwner: c.owner };
      if (i >= 0) CL.clubs[i] = loc; else CL.clubs.unshift(loc);
      CL.tours = CL.tours.filter((t) => t.clubId !== c.id).concat(c.tournaments.map(mapTour));
      if (st.screen === 'clubNew' || st.screen === 'tourNew' || st.pendingClub) { st.pendingClub = false; go('club', { clubId: c.id }); } else if (!['table', 'guide'].includes(st.screen)) render();
      break;
    }
    case 'tournaments': CL.tours = m.list.map(mapTour); if (!['table', 'guide'].includes(st.screen)) render(); break;
    case 'tournament': toast(`🏁 ${m.tournament?.name}: ${m.tournament?.results?.ranking?.[0] || ''} ניצח`); refreshLobby(); break;
    case 'queued': NET.queued = !m.matched && !m.cancelled; if (!m.matched && !m.cancelled) toast('מחפש יריב…'); if (st.screen !== 'table') render(); break;
    case 'levelUp': setTimeout(() => showLevelUp(m.level), 600); break;
    case 'reminder': toast(`⏰ אתה משחק כבר ${m.minutes} דקות. זה זמן טוב להפסקה.`); break;
    case 'match': onMatchView(m.view); break;
    default: break;
  }
}

// ----- live match adapter: makes a server view look like the local engine objects -----
function boardAdapter(bv, view) {
  const legal = bv.legal ? bv.legal.map((moves) => ({ moves, state: applySequence(bv.state, bv.turn, moves) })) : null;
  const act = (action, extra = {}) => netSend({ t: 'act', matchId: view.id, board: bv.index, action, ...extra });
  return {
    state: bv.state, dice: bv.dice, phase: bv.phase, turn: bv.turn, cube: bv.cube, cubeEnabled: bv.cubeEnabled, crawford: bv.crawford,
    result: bv.result, rollIndex: bv.rollIndex, plies: bv.rollIndex, legal, _you: bv.yourColor,
    canDouble: () => !!bv.canDouble, rollIsForced: () => !bv.canDouble,
    roll: () => act('roll'), double: () => act('double'), take: () => act('take'), drop: () => act('drop'), resign: () => act('resign'),
    move: (c, moves) => act('move', { moves }),
  };
}
function matchAdapter(view, prev) {
  const you = view.you; const opp = you === 'A' ? 'B' : 'A';
  const boards = view.boards.map((bv) => boardAdapter(bv, view));
  // keep per-game "counted" flags across updates
  if (prev) boards.forEach((b, i) => { if (prev._boards?.[i]?._counted && b.phase === 'over') b._counted = true; });
  return {
    _view: view, _boards: boards, kind: view.kind, over: view.over, pairs: view.target, target: view.target,
    winner: view.winner === 'draw' ? 'draw' : view.winner == null ? null : view.winner === you ? 'A' : 'B',
    score: { A: view.score[you], B: view.score[opp] },
    rounds: { length: view.kind === 'duplicate' ? Math.floor(view.gamesFinished / 2) + 1 : 0 },
    games: { length: view.gamesFinished + 1 },
    boards: () => boards,
    colorOf: (seat, b = 0) => (seat === 'A' ? view.boards[b].yourColor : other(view.boards[b].yourColor)),
    seatOf: (color, b = 0) => (color === view.boards[b].yourColor ? 'A' : 'B'),
    settle() {},
  };
}
function onMatchView(view) {
  const first = !G.online || G.M?._view?.id !== view.id;
  const oppSeat = view.you === 'A' ? 'B' : 'A'; const opp = view.players[oppSeat];
  G.online = true;
  G.M = matchAdapter(view, first ? null : G.M);
  if (first) {
    stopTimers(); G.ended = false; G.view = 0; G.partial = new Map(); G.selected = null; G.last = new Map(); G.rolled = new Set(); G.bubbles = {};
    NET.ratingAtStart = NET.me?.rating ?? P.rating; NET.queued = false;
    G.cfg = { oppName: opp.name, level: opp.bot || 'intermediate', label: view.tournamentId ? 'טורניר' : 'משחק אונליין', stake: 0, arena: null };
    vsScreen(opp.name, opp.bot || 'intermediate', () => { st.screen = 'table'; render(); }, 0);
    return;
  }
  if (st.screen === 'table') step();
}
function finishOnline() {
  const M = G.M; const won = M.winner === 'A'; const draw = M.winner === 'draw';
  netSend({ t: 'me' });
  if (won) { sfx.win(); confetti(); } else if (!draw) sfx.lose();
  setTimeout(() => {
    const delta = (NET.me?.rating ?? P.rating) - (NET.ratingAtStart ?? P.rating);
    const done = () => { $('.V.res')?.remove(); G.online = false; go('home'); refreshLobby(); };
    document.body.append(resultScreen({ won, draw, xp: 10 + (won ? 15 : 0), delta, prizeLine: null, again: done, close: done, cash: false }));
  }, 700);
}
