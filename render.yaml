# Render Blueprint — deploys the beta server (shesh-besh/) as a free web service.
services:
  - type: web
    name: double-six
    runtime: node
    plan: free
    rootDir: shesh-besh
    buildCommand: npm ci && node scripts/build-play.js
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_TOKEN
        generateValue: true
      - key: DATABASE_URL
        sync: false
      # Real-money mode — enabled by the owner on 2026-11-28, who accepted the legal risk.
      # NO legal opinion exists yet. Cash play is limited to players the admin approves (manual KYC).
      - key: REAL_MONEY
        value: "1"
      - key: LEGAL_APPROVAL_REF
        value: "OWNER-ACCEPTED-RISK-2026-11-28-NO-LEGAL-OPINION"
      - key: PAYMENT_PROVIDER
        value: "none"
      - key: MIN_GAMES_FOR_CASH
        value: "0"
      - key: CASH_NO_RATING_GATE
        value: "1"
