<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0e0e10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="גלריה">
<title>גלריה</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Caveat:wght@500;700&family=Frank+Ruhl+Libre:wght@500;700&family=Rubik:wght@400;700&family=Secular+One&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===== ספרייה ===== -->
<section id="lib" class="screen active">
  <header class="bar">
    <h1>גלריה</h1>
    <button id="btnSettings" class="icon" aria-label="הגדרות">⚙︎</button>
  </header>
  <div id="items" class="list"></div>
  <footer class="dock">
    <label class="btn primary">
      + סרטון חדש
      <input id="fileIn" type="file" accept="video/*" hidden>
    </label>
  </footer>
</section>

<!-- ===== עורך ===== -->
<section id="edit" class="screen">
  <header class="bar">
    <button id="edBack" class="btn small back">→ חזרה</button>
    <input id="edName" data-i="name" class="title-in" placeholder="שם הסרטון">
    <button id="edPerform" class="btn small primary">הופעה</button>
  </header>

  <div class="ed-body">
    <div class="preview-wrap"><canvas id="edCanvas"></canvas></div>
    <div class="transport">
      <button id="edPlay" class="icon">▶</button>
      <input id="edScrub" type="range" min="0" max="10" step="0.01" value="0">
      <span id="edTime" class="mono">0.00</span>
    </div>
    <label class="row tight"><input id="edShowAll" type="checkbox" checked> הצג חשיפה תמיד (תצוגה מקדימה)</label>

    <details open class="card">
      <summary>1 · מה חושפים ואיך מזינים</summary>
      <label class="row">סוג
        <select data-i="content" id="edContent">
          <option value="number">מספר</option>
          <option value="word">מילה / שם / מדינה</option>
          <option value="drawing">ציור</option>
        </select>
      </label>
      <label class="row">שיטת קלט סודית
        <select data-i="method" id="edMethod"></select>
      </label>
      <p id="edMethodHelp" class="help"></p>
      <label class="col" id="edWordsWrap">רשימת מילים (שורה לכל מילה – המיקום ברשימה = מספר)
        <textarea id="edWords" rows="5"></textarea>
      </label>
      <label class="row">תאריך הצילום (מוצג בגלריה)
        <input id="edShot" type="datetime-local">
      </label>
      <label class="row">טקסט לדוגמה בתצוגה
        <input id="edSample" placeholder="47">
      </label>
    </details>

    <details open class="card">
      <summary>2 · אזורי חשיפה <span class="help">(גרור על התמונה כדי לסמן)</span></summary>
      <div id="edRegions" class="chips"></div>
      <div class="row gap">
        <button id="rgAdd" class="btn small">+ אזור</button>
        <button id="rgDel" class="btn small danger">מחק אזור</button>
      </div>

      <div id="rgForm">
        <label class="row">זמן חשיפה (שנ׳)
          <span class="inline"><input data-r="t" type="number" step="0.05" min="0"><button id="rgNow" class="btn small">עכשיו</button></span>
        </label>
        <label class="row">אפקט
          <select data-r="effect">
            <option value="fade">הופעה הדרגתית</option>
            <option value="wipe">כתיבה / מחיקה</option>
            <option value="develop">פיתוח (כמו פולרויד)</option>
            <option value="pop">קפיצה</option>
            <option value="cut">מיידי</option>
          </select>
        </label>
        <label class="row">משך אפקט (שנ׳) <input data-r="fade" type="number" step="0.1" min="0"></label>
        <label class="row">גופן
          <select data-r="font" id="rgFont"></select>
        </label>
        <label class="row">צבע <input data-r="color" type="color"></label>
        <label class="row">אטימות <input data-r="opacity" type="range" min="0.05" max="1" step="0.01"></label>
        <label class="row">סיבוב° <input data-r="rot" type="range" min="-45" max="45" step="0.5"></label>
        <label class="row">הטיה° <input data-r="skew" type="range" min="-30" max="30" step="0.5"></label>
        <label class="row">מיזוג
          <select data-r="blend">
            <option value="source-over">רגיל</option>
            <option value="multiply">דיו על נייר (Multiply)</option>
            <option value="screen">אור / מסך (Screen)</option>
            <option value="overlay">שכבה (Overlay)</option>
            <option value="soft-light">אור רך</option>
          </select>
        </label>
        <label class="row tight"><input data-r="bold" type="checkbox"> מודגש</label>
        <label class="row tight"><input data-r="shadow" type="checkbox"> צל</label>
        <fieldset class="track">
          <legend><label><input data-r="track.on" type="checkbox"> מעקב תנועה (האזור זז)</label></legend>
          <div class="row gap">
            <label><input type="radio" name="edTarget" value="start" checked> מיקום התחלה</label>
            <label><input type="radio" name="edTarget" value="end"> מיקום סיום</label>
          </div>
          <label class="row">זמן סיום (שנ׳)
            <span class="inline"><input data-r="track.t2" type="number" step="0.05" min="0"><button id="rgNow2" class="btn small">עכשיו</button></span>
          </label>
        </fieldset>
      </div>
    </details>

    <div class="row gap end">
      <button id="edStage" class="btn">מצב במה</button>
      <button id="edDup" class="btn">שכפל</button>
      <button id="edDelete" class="btn danger">מחק סרטון</button>
    </div>
  </div>
</section>

<!-- ===== הגדרות ===== -->
<section id="settings" class="screen">
  <header class="bar">
    <button id="stBack" class="btn small back">→ חזרה</button>
    <h1>הגדרות</h1>
    <span></span>
  </header>
  <div class="ed-body">
    <div class="card">
      <label class="row tight"><input data-s="vibrate" type="checkbox"> רטט קצר על כל הקשה סודית (אנדרואיד)</label>
      <label class="row tight"><input data-s="indicator" type="checkbox"> אינדיקטור דיסקרטי (נקודות זעירות בפינה)</label>
      <label class="row tight"><input data-s="record" type="checkbox"> הקלט את ההופעה לשיתוף עם הצופה</label>
      <label class="row">תצוגה בהופעה
        <select data-s="viewStyle"><option value="photos">כמו גלריית אייפון</option><option value="clean">מסך נקי</option></select>
      </label>
      <label class="row">מראה הגלריה
        <select data-s="phTheme"><option value="dark">כהה</option><option value="light">בהיר</option></select>
      </label>
    </div>
    <div class="card">
      <p class="help">יופיע בכרטיס הסיום של הסרטון המשותף</p>
      <label class="row">שם <input data-s="contactName" placeholder="הקוסם ..."></label>
      <label class="row">קישור / אינסטגרם <input data-s="contactLink" placeholder="@my.magic" dir="ltr"></label>
    </div>
    <div class="card help">
      <b>מחוות בזמן הופעה</b><br>
      הקשה ראשונה – מתחיל את הסרטון · לחיצה ארוכה – תפריט נסתר · הקשה בשתי אצבעות – ביטול אחרון · מקלדת Bluetooth: רווח/חץ מתחיל, Esc תפריט.
    </div>
  </div>
</section>

<!-- ===== קלט מראש (מוסווה כחיפוש) ===== -->
<section id="pre" class="screen">
  <header class="bar">
    <button id="preBack" class="btn small back">→ חזרה</button>
    <h1>חיפוש</h1><span></span>
  </header>
  <form id="preForm" class="ed-body">
    <input id="preIn" class="search" placeholder="🔍 חיפוש בגלריה" autocomplete="off">
    <button class="btn primary" type="submit">חפש</button>
  </form>
</section>

<!-- ===== הופעה ===== -->
<section id="perform" class="screen">
  <canvas id="stage"></canvas>
  <div id="touch"></div>
  <button id="pBack" class="btn small back">→ חזרה</button>
  <div id="ph" hidden>
    <div class="ph-top">
      <button id="phBack" class="ph-round" aria-label="חזרה"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
      <div class="ph-title"><b id="phDay">היום</b><span id="phTime">12:00</span></div>
      <button id="phMore" class="ph-round" aria-label="עוד"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5.5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="18.5" cy="12" r="1.9"/></svg></button>
    </div>
    <div class="ph-bottom">
      <div class="ph-scrub-row">
        <button id="phPlay" class="ph-round sm" aria-label="נגן"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.6v14.8c0 .8.9 1.3 1.6.9l12-7.4c.6-.4.6-1.4 0-1.8l-12-7.4C7.9 3.3 7 3.8 7 4.6z"/></svg></button>
        <div class="ph-strip" id="phStripBox"><canvas id="phStrip"></canvas><div id="phHead"></div></div>
        <button id="phMute" class="ph-round sm" aria-label="שמע"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M15.5 9a4.5 4.5 0 010 6M18 6.5a8 8 0 010 11"/></svg></button>
      </div>
      <div class="ph-tools">
        <button id="phShare" aria-label="שיתוף"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5v11M8.2 7.2L12 3.5l3.8 3.7"/><path d="M8.5 10.5H7a2 2 0 00-2 2v6a2 2 0 002 2h10a2 2 0 002-2v-6a2 2 0 00-2-2h-1.5"/></svg></button>
        <button id="phHeart" aria-label="מועדף"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M12 20s-7.5-4.6-7.5-10.2A4.2 4.2 0 0112 7.3a4.2 4.2 0 017.5 2.5C19.5 15.4 12 20 12 20z"/></svg></button>
        <button id="phInfo" aria-label="מידע"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="8.6"/><path d="M12 11v5.5"/><circle cx="12" cy="7.8" r=".6" fill="currentColor"/></svg></button>
        <button id="phEdit" aria-label="עריכה"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h9M18 7h2M4 17h3M12 17h8"/><circle cx="15.5" cy="7" r="2.3"/><circle cx="9.5" cy="17" r="2.3"/></svg></button>
        <button id="phTrash" aria-label="מחיקה"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 6.5h15M9.5 6.5V4.5h5v2M6.5 6.5l1 13a1.5 1.5 0 001.5 1.4h6a1.5 1.5 0 001.5-1.4l1-13M10 10.5v6.5M14 10.5v6.5"/></svg></button>
      </div>
    </div>
  </div>
  <div id="pmenu" hidden>
    <button data-m="resume" class="btn">המשך</button>
    <button data-m="restart" class="btn">התחל מחדש</button>
    <button data-m="share" class="btn primary">שתף סרטון</button>
    <button data-m="exit" class="btn danger">יציאה</button>
  </div>
</section>

<div id="vhost" aria-hidden="true"></div>
<div id="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
